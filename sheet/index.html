<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Филипп</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="art/icon-180.png">
<link rel="icon" href="art/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Филипп">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* IDEA   один экран, готовый к игре: всё главное видно сразу, детали выезжают шторкой
   FEEL   лист проминается под пальцем, шторка тянется за пальцем, кубик вылетает из-под пальца и бьётся о стол
   ART    портрет Филиппа живёт в темноте за листом и встречает при запуске */
:root{color-scheme:dark;
 --bg:#0b080c;--bg2:rgba(20,15,22,.86);--ink:#ece4d8;--mute:#a39888;--line:rgba(236,228,216,.13);
 --paper:#d8ccb6;--paper2:#c4b597;--paperInk:#2a1d17;--paperMute:#6e5a48;
 --blood:#b3233a;--red2:#e0485e;--gold:#e9bd6c;--gold2:#f6d58e;--violet:#a57cff;--green:#86c79c;
 --gap:0px;--sb:max(env(safe-area-inset-bottom),var(--minsb,0px));--tabh:calc(54px + var(--sb))}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{margin:0;color:var(--ink);font:16px/1.4 Alegreya,Georgia,serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink);background:#0e0a0f;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;text-align:center;-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:600;line-height:1;margin:0}
.px{image-rendering:pixelated}

/* ===== портрет: фон и заставка ===== */
.bgart{position:fixed;inset:0 0 calc(-1*var(--gap)) 0;z-index:0;pointer-events:none;overflow:hidden}
.bgart img{position:absolute;right:-18%;top:-2%;height:78%;width:auto;max-width:none;opacity:.28;filter:saturate(.8);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.bgart::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 18%,rgba(11,8,12,.55) 60%,rgba(11,8,12,.2)),linear-gradient(0deg,var(--bg) 35%,transparent 70%)}
.flame{position:absolute;inset:0;mix-blend-mode:soft-light;background:radial-gradient(50% 35% at 70% 40%,rgba(255,190,110,.5),transparent 70%);animation:flick 3.2s infinite}
@keyframes flick{0%,100%{opacity:.8}12%{opacity:.55}20%{opacity:.95}43%{opacity:.65}61%{opacity:1}78%{opacity:.7}}
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:end center;transition:opacity .6s ease .1s}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;transition:transform 1s cubic-bezier(.3,0,.2,1)}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 8%,transparent 55%)}
.splash .t{position:relative;z-index:1;text-align:center;padding-bottom:16vh}
.splash h1{font-size:64px;font-weight:500;text-shadow:0 2px 20px #000}
.splash p{font:italic 500 19px "Cormorant Garamond",serif;color:#d9cdbb;margin:6px 0 0}
.splash.go{opacity:0;pointer-events:none}
.splash.go img{transform:scale(1.08) translateY(-2%)}

/* ===== экран ===== */
.page{position:fixed;inset:0 0 calc(var(--tabh) - var(--gap)) 0;z-index:1;display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page.on{display:block;animation:pg .28s ease-out}
.screen{height:calc(100svh + var(--gap) - var(--tabh));display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px;max-width:560px;margin:0 auto}
.below{max-width:560px;margin:0 auto;padding:6px 14px 30px}
.below h2{font-size:22px;margin:4px 0 6px;color:var(--mute)}
.log{color:var(--mute);font-size:14px}
.log div{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log b{color:var(--ink);font-weight:500}
.senses{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sense{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:4px 6px;display:flex;align-items:center;gap:6px;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.sense b{font:700 21px/1 "Cormorant Garamond",serif;color:var(--gold2)}
.sense span{font-size:11.5px;line-height:1.1;color:var(--mute);text-align:left}
.info{padding:2px 6px 10px;font-size:15.5px;line-height:1.45;color:#ddd3c4}
.info p{margin:0 0 9px}
.info b{color:var(--gold2);font-weight:500}
.info .mu{color:var(--mute);font-size:13px}
.info .how{background:rgba(233,189,108,.07);border-left:3px solid var(--gold);border-radius:8px;padding:8px 10px;margin:4px 0 10px;font-size:14.5px}
.dacts{display:grid;gap:8px;padding-top:4px}
.dacts button{border-radius:14px;padding:13px;font-weight:700;font-size:16px;background:var(--gold);color:#1b1208}
.dacts button.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.dacts button:disabled{opacity:.4}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}

.head{display:flex;align-items:center;gap:10px}
.head .face{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover}
.head .who{flex:1;line-height:1.15}
.head h1{font-size:26px;font-weight:600}
.head .cls{font:italic 500 14px "Cormorant Garamond",serif;color:var(--mute)}
.head .cls b{color:var(--gold);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,15,22,.7);border:1px solid var(--line)}
.iconbtn.on{background:var(--gold);color:#1b1208}

.vit{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px}
.tok{background:linear-gradient(160deg,rgba(36,26,36,.92),rgba(21,15,22,.92));border:1px solid rgba(233,189,108,.22);border-radius:14px;padding:6px 4px 6px;text-align:center;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.tok .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tok .v{font:700 24px/1.05 "Cormorant Garamond",serif}
.tok .v small{font-size:14px;color:var(--mute);font-weight:600}
.tok.hp{text-align:left;padding-left:10px}
.hpbar{height:4px;background:#2b1c24;border-radius:3px;margin-top:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#7d1426,var(--red2));transition:width .45s cubic-bezier(.3,1.5,.5,1)}
.tok .temp{color:var(--violet);font-size:14px}

.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px}
.mode button{padding:4px 2px;border-radius:8px;font-size:12.5px;color:var(--mute);border:1px solid transparent;background:none;transition:.15s}
.mode button.on{color:var(--ink);border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(233,189,108,.35)}
.mode button.on[data-m="adv"]{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 0 1px rgba(134,199,156,.35),0 0 12px rgba(134,199,156,.2)}
.mode button.on[data-m="dis"]{border-color:var(--red2);color:var(--red2);box-shadow:inset 0 0 0 1px rgba(224,72,94,.35),0 0 12px rgba(224,72,94,.2)}

/* характеристики: клочки бумаги, растягиваются по свободной высоте */
.abil{flex:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:8px 8px;padding:2px 0}
.spare{flex:1 1 auto;min-height:0}
.ab{position:relative;color:var(--paperInk);filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));transition:transform .12s cubic-bezier(.3,1.6,.5,1);display:flex;min-height:0}
.ab .sheet{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px;text-align:center;background:
  radial-gradient(120% 90% at 30% 10%,rgba(255,250,235,.55),transparent 55%),
  radial-gradient(90% 70% at 90% 100%,rgba(120,80,40,.28),transparent 60%),
  linear-gradient(170deg,var(--paper),var(--paper2));
  clip-path:polygon(2% 3%,22% 0,41% 2.5%,63% .5%,84% 2.8%,99% 1%,97.5% 24%,100% 47%,98% 71%,99.5% 97%,79% 99%,58% 97.5%,37% 100%,18% 98%,1% 99.5%,2.5% 75%,0 52%,2% 28%)}
.ab:nth-child(2n) .sheet{transform:rotate(.8deg)}.ab:nth-child(3n) .sheet{transform:rotate(-.6deg)}
.ab .ic{width:var(--ic,48px);height:var(--ic,48px);flex:none;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.ab .nm{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:3px;white-space:nowrap}
.ab .n{font:600 14px/1 "Cormorant Garamond",serif}
.ab .m{font:700 26px/1 "Cormorant Garamond",serif}
.ab .s{font-size:11.5px;color:var(--paperMute);margin-top:2px;display:flex;gap:4px;align-items:center}
.ab .s .dot{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--paperMute)}
.ab .s .dot.on{background:var(--blood);border-color:var(--blood)}
.slip.pressed,.lang.pressed,.chr.pressed,.pressed{transform:scale(.93) translateY(2px)!important}

/* судьба */
.fate{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fc{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:5px 10px;min-height:40px;text-align:left;display:flex;align-items:center;gap:8px;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.fc .t{font:600 16.5px/1.05 "Cormorant Garamond",serif;flex:1}
.fc .t small{display:block;font:400 11.5px/1.2 Alegreya,serif;color:var(--mute);margin-top:2px}
.fc .ch{display:flex;gap:5px}
.charge{width:14px;height:14px;transform:rotate(45deg);border-radius:3px;border:1.6px solid var(--gold);background:radial-gradient(circle at 35% 35%,#fff3cf,var(--gold) 55%,#8d6020);box-shadow:0 0 8px rgba(233,189,108,.5);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.charge.v{border-color:var(--violet);background:radial-gradient(circle at 35% 35%,#e3d4ff,var(--violet) 55%,#4b2c8f);box-shadow:0 0 8px rgba(165,124,255,.55)}
.charge.r{border-color:var(--red2);background:radial-gradient(circle at 35% 35%,#ffc2cb,var(--red2) 55%,#6e1222);box-shadow:0 0 8px rgba(224,72,94,.5)}
.charge.used{background:#120d13;box-shadow:none;border-color:#4a3d36;transform:rotate(45deg) scale(.75)}
.fc.armed{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 18px rgba(165,124,255,.35)}
.fc.rest{justify-content:center;min-height:34px;padding:3px 8px}
.fc.rest .t{font-size:15px}
.fc.rest .t{flex:none;text-align:center}

/* ===== общение ===== */
.shead{display:flex;align-items:center;gap:10px}
.shead img{width:40px;height:40px}
.shead h1{font-size:28px;font-weight:500}
.shead .cls{font:italic 500 15px "Cormorant Garamond",serif;color:var(--gold)}
.slips{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:8px 7px}
.slip{position:relative;display:flex;min-height:0;color:var(--paperInk);filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.slip .sheet{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 5px;text-align:center;background:
  radial-gradient(120% 90% at 30% 10%,rgba(255,250,235,.55),transparent 55%),radial-gradient(90% 70% at 90% 100%,rgba(120,80,40,.28),transparent 60%),linear-gradient(170deg,var(--paper),var(--paper2));
  clip-path:polygon(1% 4%,24% 0,47% 3%,71% .5%,99% 2.5%,97.5% 30%,100% 62%,98.5% 97%,73% 99.5%,49% 97%,26% 100%,1.5% 98%,0 66%,2% 34%)}
.slip:nth-child(2n) .sheet{transform:rotate(-.7deg)}.slip:nth-child(3n) .sheet{transform:rotate(.6deg)}
.slip .n{font:600 15px/1.05 "Cormorant Garamond",serif;display:flex;align-items:center;gap:4px}
.slip .n .dot{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--paperMute);flex:none}
.slip .n .dot.on{background:var(--gold);border-color:#a8782c;box-shadow:0 0 6px rgba(233,189,108,.6)}
.slip .m{font:700 clamp(24px,4.4vh,36px)/1 "Cormorant Garamond",serif;margin:3px 0 2px}
.slip .h{font-size:11px;line-height:1.15;color:var(--paperMute)}
.slip.pas .sheet{background:linear-gradient(170deg,#2a2029,#1a1319);clip-path:none;border:1px dashed rgba(233,189,108,.35);border-radius:12px;color:var(--ink)}
.slip.pas .h{color:var(--mute)}
.fc.heart{min-height:42px}
.fc.heart .eye{color:var(--blood);font-size:18px;text-shadow:0 0 10px rgba(179,35,58,.7)}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lang{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 2px;font:600 14px/1 "Cormorant Garamond",serif;text-align:center;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.lang.ex{color:#d9a0ff;border-color:rgba(165,124,255,.35)}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chr{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:6px 9px;text-align:left;min-height:0;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.chr b{display:block;font:600 11px/1 Alegreya,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.chr span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:500 14.5px/1.12 "Cormorant Garamond",serif}
.chr.c2{border-left-color:var(--violet)}.chr.c3{border-left-color:var(--blood)}.chr.c4{border-left-color:#6f6458}
@media (max-height:700px){.shead img{width:32px;height:32px}.shead h1{font-size:23px}.chr{padding:4px 8px}.lang{padding:4px 2px}.fc.heart{min-height:36px}}
@media (max-height:600px){.slip .h{display:none}.shead .cls{display:none}}

/* заглушки */
.soon{flex:1;display:grid;place-items:center;text-align:center}
.soon h2{font-size:38px;font-weight:500}
.soon p{color:var(--mute);max-width:30ch;margin:8px auto 0}
.soon img{width:88px;height:88px;margin:0 auto 12px;display:block}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px;margin:18px auto 0}
.coin{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
.coin .c{width:24px;height:24px;margin:0 auto;display:block}
.coin .v{font:700 22px/1.1 "Cormorant Garamond",serif}
.coin .k{font-size:11px;color:var(--mute)}
.coin .pm{display:flex;gap:4px;margin-top:5px}
.coin .pm button{flex:1;background:#221a22;border-radius:8px;padding:5px 0}

/* нижнее меню */
.tabs{position:fixed;left:0;right:0;bottom:calc(-1*var(--gap));z-index:40;height:var(--tabh);background:rgba(11,8,12,.96);border-top:1px solid var(--line);padding:5px 6px var(--sb);display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;color:var(--mute);font-size:11.5px}
.tabs .ti{width:38px;height:38px;border-radius:8px;object-fit:cover;opacity:.5;transition:.2s}
.tabs button.on{color:var(--ink)}
.tabs button.on .ti{opacity:1;transform:translateY(-2px);filter:drop-shadow(0 0 8px rgba(233,189,108,.45))}
.tabs .fc2{border-radius:50%;border:1.5px solid var(--gold)}

/* ===== шторка навыков ===== */
.dim{position:fixed;inset:0 0 calc(-1*var(--gap)) 0;z-index:80;background:rgba(6,4,8,0);pointer-events:none;transition:background .25s}
.dim.on{background:rgba(6,4,8,.62);pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:calc(-1*var(--gap));z-index:81;max-width:560px;margin:0 auto;background:linear-gradient(175deg,#1d1520,#120d14);border-top:1px solid rgba(233,189,108,.35);border-radius:22px 22px 0 0;padding:6px 12px calc(14px + var(--sb));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,1.15,.35,1);box-shadow:0 -14px 40px rgba(0,0,0,.6);max-height:82vh;display:flex;flex-direction:column;touch-action:none}
.drawer.on{transform:translateY(0)}
.drawer .grab{width:44px;height:5px;border-radius:3px;background:rgba(236,228,216,.3);margin:4px auto 8px}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:0 4px 8px}
.drawer .dh img{width:48px;height:48px}
.drawer .dh h2{font-size:28px;flex:1}
.drawer .dh .sc{font-size:13px;color:var(--mute);text-align:right}
.drawer .dh .sc b{display:block;font:700 26px/1 "Cormorant Garamond",serif;color:var(--ink)}
.drows{overflow:auto;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left;border-top:1px solid var(--line);transition:background .12s,transform .12s}
.row:first-child{border-top:0}
.row:active{background:#2a1f2c}
.row .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #6f6458;flex:none}
.row .dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(233,189,108,.55)}
.row .dot.red.on{background:var(--blood);border-color:var(--blood);box-shadow:0 0 8px rgba(179,35,58,.6)}
.row .nm{flex:1;font-size:17px}
.row .nm small{display:block;font-size:12px;color:var(--mute)}
.row .tag{font-size:11px;color:var(--violet);border:1px solid currentColor;border-radius:6px;padding:0 5px}
.row .md{font:700 24px "Cormorant Garamond",serif;min-width:42px;text-align:right}
.row.main{background:rgba(233,189,108,.06)}
.row .d20{width:18px;height:18px;opacity:.5;flex:none}
.passive{display:flex;justify-content:space-between;color:var(--mute);font-size:13.5px;padding:10px 6px 0}
.passive b{color:var(--gold2);font:700 20px "Cormorant Garamond",serif}
.drawer .edrow{display:flex;gap:10px;align-items:center;padding:4px 4px 10px;color:var(--mute);font-size:14px}
.drawer .edrow input{width:90px;font-size:22px;padding:4px}

/* ===== бросок ===== */
.roll{position:fixed;inset:0 0 calc(-1*var(--gap)) 0;z-index:100;display:none;background:rgba(6,4,8,0);transition:background .2s}
.roll.on{display:block;background:rgba(6,4,8,.8)}
.die{position:absolute;left:0;top:0;width:136px;height:136px;margin:-68px 0 0 -68px;will-change:transform;z-index:2}
.die svg{width:100%;height:100%;overflow:visible}
.num{font:700 42px "Cormorant Garamond",serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.shd{position:absolute;width:110px;height:16px;margin:-8px 0 0 -55px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.8),transparent 70%)}
.die2{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;opacity:.5}
.die2 svg{width:100%;height:100%}
.dust{position:absolute;width:5px;height:5px;background:var(--paper);pointer-events:none}
.res{position:absolute;left:0;right:0;top:calc(50% + 30px);text-align:center;opacity:0;transform:translateY(10px);transition:.25s;padding:0 16px}
.res.on{opacity:1;transform:none}
.res .lbl{color:#cbbfae;font:italic 500 20px "Cormorant Garamond",serif}
.res .tot{font:700 78px/1 "Cormorant Garamond",serif;color:#fff}
.res .br{color:var(--paper);font-size:15px;margin-top:4px}
.res .br b{color:#fff}
.res .crit{font:600 22px "Cormorant Garamond",serif;margin-top:6px}
.res .acts{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.res .acts button{border:1px solid rgba(233,189,108,.5);color:var(--gold2);border-radius:999px;padding:9px 16px;font-size:15px;background:rgba(233,189,108,.08)}
.res .pick{display:flex;justify-content:center;gap:10px;margin-top:12px}
.res .pick button{border:1px solid var(--line);border-radius:14px;padding:8px 18px;background:#1d151e}
.res .pick button b{display:block;font:700 34px "Cormorant Garamond",serif}
.res .pick button.best{border-color:var(--gold)}
.res .hint{color:var(--mute);font-size:13px;margin-top:14px}
.shake{animation:shake .3s}
@keyframes shake{15%{transform:translate(-6px,3px)}35%{transform:translate(5px,-3px)}55%{transform:translate(-3px,2px)}75%{transform:translate(2px,-1px)}}

/* ввод чисел */
.sheetbg{position:fixed;inset:0 0 calc(-1*var(--gap)) 0;z-index:90;display:none;background:rgba(6,4,8,.7);align-items:flex-end}
.sheetbg.on{display:flex}
.sheetbg form{width:100%;max-width:560px;margin:0 auto;background:#171118;border-top:1px solid rgba(233,189,108,.3);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--sb));display:flex;flex-direction:column;gap:11px;animation:up .28s cubic-bezier(.2,1.25,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheetbg h2{font-size:25px}
.sheetbg .big{font-size:30px;padding:10px}
.sheetbg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetbg .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheetbg label{font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px;text-align:center}
.go{border-radius:14px;padding:13px;font-weight:700;font-size:17px}
.go.red{background:var(--blood);color:#fff}.go.grn{background:#2f6a45;color:#fff}.go.gold{background:var(--gold);color:#1b1208}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) - var(--gap) + 10px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;background:#2a2030;border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:.2s;width:max-content;max-width:calc(100% - 32px);font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}
@media (max-height:700px){.screen{gap:6px}.head .face{width:34px;height:34px}.head h1{font-size:23px}.tok .v{font-size:21px}.fate{gap:5px}.fc{min-height:36px}}
@media (max-height:600px){.head .cls{display:none}.fate .fc .t small{display:none}.fc{min-height:32px;padding:3px 9px}.ab .n{font-size:13px}.ab .s{font-size:10.5px}
 .ab .sheet{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 4px}.ab .ic{width:30px!important;height:30px!important}.ab .n{width:100%}.ab .m{font-size:24px}}
</style>
</head>
<body>

<div class="bgart"><img src="art/portrait.webp" alt="" class="px" id="bgImg"><div class="flame"></div></div>
<div class="splash" id="splash"><img src="art/portrait.webp" alt="" class="px"><div class="t"><h1>Филипп</h1><p>…и ещё одна ночь в Баровии</p></div></div>

<section class="page on" id="p-char">
 <div class="screen">
  <div class="head">
    <img class="face" src="art/face.webp" alt="">
    <div class="who"><h1 id="nm">Филипп</h1><div class="cls" id="cl"></div></div>
    <button class="iconbtn" id="editBtn" aria-label="Изменить цифры"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg></button>
  </div>

  <div class="vit">
    <button class="tok hp" id="hpTok"><div class="k">Хиты</div><div class="v"><span id="hpCur"></span> <small>/ <span id="hpMax"></span></small> <span class="temp" id="hpTemp"></span></div><div class="hpbar"><i id="hpBar"></i></div></button>
    <div class="tok"><div class="k">КД</div><div class="v" id="acV"></div></div>
    <div class="tok"><div class="k">Шаг</div><div class="v" id="spV"></div></div>
    <button class="tok" id="initTok"><div class="k">Иниц.</div><div class="v" id="initV"></div></button>
  </div>

  <div class="senses" id="senses"></div>

  <div class="mode" id="mode">
    <button data-m="norm" class="on">Обычный</button>

  </div>

  <div class="abil" id="abil"></div>
  <div class="spare" id="spare"></div>

  <div class="fate" id="fate"></div>
 </div>
 <div class="below"><h2>Последние броски</h2><div class="log" id="log"></div></div>
</section>

<section class="page" id="p-social"><div class="screen">
  <div class="shead"><img class="px" src="art/ab-cha.webp" alt=""><div><h1>Общение</h1><div class="cls">Харизма <span id="chaMod"></span> · мастерство <span id="profS"></span></div></div></div>
  <div class="mode" id="mode2">
    <button data-m="norm" class="on">Обычный</button>
    <button data-m="adv">Преимущество</button>
    <button data-m="dis">Помеха</button>
  </div>
  <div class="slips" id="slips"></div>
  <button class="fc heart" data-info="heart"><span class="t">Сердце тьмы<small>умение предыстории: простые люди тебе помогают</small></span><span class="eye">◉</span></button>
  <div class="langs" id="langs"></div>
  <div class="chars" id="chars"></div>
 </div></section>
<section class="page" id="p-fight"><div class="screen"><div class="soon"><div><img class="px" src="art/ab-dex.webp" alt=""><h2>Бой</h2><p>Заклинания, ячейки, действие и бонусное действие, дикая магия. Скоро.</p></div></div></div></section>
<section class="page" id="p-inv"><div class="screen"><div class="soon"><div><img class="px" src="art/ab-int.webp" alt=""><h2>Инвентарь</h2><p>Пока здесь только кошель. Остальное скоро.</p><div class="coins" id="coins"></div></div></div></div></section>

<nav class="tabs" id="tabs">
  <button data-p="p-char" class="on" aria-label="Персонаж"><img class="ti fc2" src="art/face.webp" alt=""></button>
  <button data-p="p-social" aria-label="Общение"><img class="ti px" src="art/ab-cha.webp" alt=""></button>
  <button data-p="p-fight" aria-label="Бой"><img class="ti px" src="art/ab-dex.webp" alt=""></button>
  <button data-p="p-inv" aria-label="Инвентарь"><img class="ti px" src="art/ab-int.webp" alt=""></button>
</nav>

<div class="dim" id="dim"></div>
<div class="drawer" id="drawer"><div class="grab"></div><div id="dbody"></div></div>
<div class="roll" id="roll"><div class="shd" id="shd"></div><div class="die" id="die"></div><div class="res" id="res"></div></div>
<div class="sheetbg" id="sheet"><form id="form"></form></div>
<div class="toast" id="toast"></div>

<script>
const AB=[['str','Сила','СИЛ'],['dex','Ловкость','ЛОВ'],['con','Телосложение','ТЕЛ'],['int','Интеллект','ИНТ'],['wis','Мудрость','МДР'],['cha','Харизма','ХАР']];
const ABN=Object.fromEntries(AB.map(a=>[a[0],a]));
const SK={
 str:[['athletics','Атлетика','лазать, плыть, прыгать, толкать']],
 dex:[['acrobatics','Акробатика','удержать равновесие, кувырок'],['sleight','Ловкость рук','стянуть, подбросить, спрятать'],['stealth','Скрытность','прятаться, красться']],
 con:[],
 int:[['arcana','Магия','заклинания, магические знаки'],['investigation','Анализ','найти улику, понять механизм'],['history','История','события, рода, легенды'],['religion','Религия','боги, нежить, обряды'],['nature','Природа','звери, травы, погода']],
 wis:[['perception','Восприятие','заметить, услышать'],['insight','Проницательность','понять, лжёт ли собеседник'],['medicine','Медицина','перевязать, понять причину смерти'],['survival','Выживание','следы, путь, охота'],['animal','Уход за животными','успокоить лошадь']],
 cha:[['deception','Обман','соврать убедительно'],['persuasion','Убеждение','уговорить, договориться'],['intimidation','Запугивание','напугать, надавить'],['performance','Выступление','стихи, песня, рассказ']]
};
/* ---------- общение ---------- */
const SOC=[['deception','cha'],['insight','wis'],['persuasion','cha'],['intimidation','cha'],['performance','cha']];
const LANGS=[['Общий',0,'Язык всех людей и большинства народов. На нём говорят в Баровии и почти везде.'],
 ['Бездны',1,'Язык демонов из Бездны. Филипп выучил его, когда годами искал демона. Понимаешь, о чём шипят демоны, можешь читать их знаки.'],
 ['Драконий',1,'Язык драконов и старых магических книг, рун и трактатов. Многие заклинания и надписи в древних местах записаны на нём.'],
 ['Инферн.',1,'Инфернальный: язык дьяволов из Девяти Преисподних, язык договоров и сделок. Вместе с языком Бездны ты понимаешь почти любую нечисть.']];
const CHAR={
 traits:{t:'Черты',full:'<p>«Я не говорю о том, что терзает меня. Предпочитаю не взваливать на других своё проклятие.»</p><p>«Я ожидаю опасности за каждым углом.»</p>',short:'Молчит о том, что терзает. Ждёт опасности за каждым углом.'},
 ideal:{t:'Идеал',full:'<p>«Я остановлю духов, что преследуют меня, или погибну в попытках сделать это.»</p><p class="mu">Мировоззрение идеала: любое.</p>',short:'Остановить духов, что преследуют его, или погибнуть.'},
 bond:{t:'Привязанность',full:'<p>«Мои мучения лишили меня любимого человека. Я жажду вернуть утраченную любовь.»</p>',short:'Вернуть утраченную любовь.'},
 flaw:{t:'Слабость',full:'<p>«У меня есть определённый ритуал, который я должен выполнять каждый день. Я никогда не должен его нарушать.»</p><p class="mu">Ритуал Филиппа: тщательно и спокойно, «как лекарь», мыть руки.</p>',short:'Каждый день моет руки «как лекарь». Не может нарушить ритуал.'}
};
const SRC={medicine:'раса',deception:'класс',insight:'класс',arcana:'предыстория',investigation:'предыстория'};
const DEFAULT={v:2,name:'Филипп',race:'Человек',cls:'Чародей',sub:'Дикая магия',bg:'Преследуемый',level:2,
 ab:{str:8,dex:14,con:14,int:12,wis:10,cha:16},saves:{con:1,cha:1},
 skills:{medicine:1,deception:1,insight:1,arcana:1,investigation:1},
 hp:{max:14,cur:14,temp:0},ac:12,speed:9,hd:{die:6,used:0},
 luck:{max:3,used:0},chaos:{max:1,used:0},insp:0,
 money:{pp:0,gp:10,sp:1,cp:0},log:[]};
let S;try{S=JSON.parse(localStorage.getItem('filipp-sheet-v2'))}catch(e){}
if(!S||S.v!==2)S=structuredClone(DEFAULT);
const save=()=>{try{localStorage.setItem('filipp-sheet-v2',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const mod=s=>Math.floor((s-10)/2);
const sg=n=>(n>=0?'+':'−')+Math.abs(n);
const prof=()=>Math.ceil(S.level/4)+1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rollMode='norm',editing=false,chaosArmed=false,inspArmed=false,openAb=null,openInfoKey=null;
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const d20i='<svg class="d20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 2l-5 9h10z M7 11l5 11 5-11"/></svg>';

/* ---------- заставка ---------- */
(function(){const sp=$('splash');let done=false;const go=()=>{if(done)return;done=true;sp.classList.add('go');setTimeout(()=>sp.remove(),800)};
 try{if(sessionStorage.getItem('filipp-splash')){sp.remove();return}sessionStorage.setItem('filipp-splash','1')}catch(e){}
 sp.addEventListener('pointerdown',go);setTimeout(go,1100)})();

/* ---------- отрисовка ---------- */
function renderHead(){
 $('nm').textContent=S.name;
 $('cl').innerHTML=`<b>${S.cls}</b> · ${S.sub} · ${S.level} ур. · мастерство ${sg(prof())}`;
 $('hpCur').textContent=S.hp.cur;$('hpMax').textContent=S.hp.max;$('hpTemp').textContent=S.hp.temp?'+'+S.hp.temp:'';
 $('hpBar').style.width=Math.max(0,Math.min(100,S.hp.cur/S.hp.max*100))+'%';
 $('acV').textContent=S.ac;$('spV').innerHTML=`${S.speed}<small>м</small>`;$('initV').textContent=sg(mod(S.ab.dex));
}
function renderAbil(){
 const p=prof();
 $('abil').innerHTML=AB.map(([k,n])=>{const m=mod(S.ab[k]),on=S.saves[k];
  return `<button class="ab" data-ab="${k}"><div class="sheet"><img class="ic px" src="art/ab-${k}.webp" alt=""><div class="nm"><span class="n">${n==='Телосложение'?'Телосл.':n}</span><span class="m">${sg(m)}</span></div></div></button>`}).join('');
}
function renderFate(){
 const pips=(o,cls)=>Array.from({length:o.max},(_,i)=>`<span class="charge ${cls} ${i<o.used?'used':''}"></span>`).join('');
 const hdLeft=S.level-S.hd.used;
 $('fate').innerHTML=`
 <button class="fc" data-info="luck"><div class="t">Везунчик<small>перебросы</small></div><div class="ch">${pips(S.luck,'')}</div></button>
 <button class="fc ${chaosArmed?'armed':''}" data-info="chaos"><div class="t">Поток хаоса<small>${chaosArmed?'готов!':'преимущество'}</small></div><div class="ch">${pips(S.chaos,'v')}</div></button>
 <button class="fc" data-info="hd"><div class="t">Кости хитов<small>к${S.hd.die}, лечат</small></div><div class="ch">${Array.from({length:S.level},(_,i)=>`<span class="charge r ${i>=hdLeft?'used':''}"></span>`).join('')}</div></button>
 <button class="fc ${inspArmed?'armed':''}" data-info="insp"><div class="t">Вдохновение<small>${inspArmed?'готово!':'от мастера'}</small></div><div class="ch"><span class="charge ${S.insp?'':'used'}"></span></div></button>
 <button class="fc rest" data-info="short"><div class="t">☾ Короткий отдых</div></button><button class="fc rest" data-info="long"><div class="t">☀ Долгий отдых</div></button>`;
}
const COINS=[['pp','платина',['#c9c6d4','#7c7988']],['gp','золото',['#f3cf7a','#a8761e']],['sp','серебро',['#d9d0c2','#837a6c']],['cp','медь',['#d38b55','#6e3f22']]];
function renderCoins(){
 $('coins').innerHTML=COINS.map(([k,n,c])=>`<div class="coin"><svg class="c" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="${c[1]}"/><rect x="2" y="2" width="8" height="8" fill="${c[1]}"/><rect x="1" y="4" width="10" height="4" fill="${c[1]}"/><rect x="4" y="10" width="4" height="1" fill="${c[1]}"/><rect x="3" y="3" width="6" height="6" fill="${c[0]}"/><rect x="2" y="4" width="8" height="4" fill="${c[0]}"/><rect x="5" y="4" width="2" height="4" fill="${c[1]}"/><rect x="3" y="3" width="1" height="1" fill="#fff"/></svg><div class="v">${S.money[k]}</div><div class="k">${n}</div><div class="pm"><button data-coin="${k}" data-d="-1">−</button><button data-coin="${k}" data-d="1">+</button></div></div>`).join('');
}
function pas(k){const a={perception:'wis',insight:'wis',investigation:'int'}[k];return 10+mod(S.ab[a])+(S.skills[k]?prof():0)}
function renderSenses(){$('senses').innerHTML=[['perception','Пассивное восприятие'],['insight','Пассивная проницат.'],['investigation','Пассивный анализ']].map(([k,n])=>`<button class="sense" data-info="senses"><b>${pas(k)}</b><span>${n}</span></button>`).join('')}
function renderLog(){if(S.log.length>7){S.log=S.log.slice(0,7);save()}$('log').innerHTML=S.log.length?S.log.map(l=>`<div><span>${esc(l.l)}</span><b>${l.t}</b></div>`).join(''):'<div><span>Пока ни одного броска</span></div>'}
function skAb(id){for(const k in SK)if(SK[k].some(x=>x[0]===id))return k}
function skMod(id){const k=skAb(id);return mod(S.ab[k])+(S.skills[id]?prof():0)}
function rollSkill(id){const k=skAb(id),[,n,s3]=ABN[k],sk=SK[k].find(x=>x[0]===id),b=[{l:s3,v:mod(S.ab[k])}];if(S.skills[id])b.push({l:'мастерство',v:prof()});d20({label:sk[1],bonus:b})}
function renderSocial(){
 $('chaMod').textContent=sg(mod(S.ab.cha));$('profS').textContent='+'+prof();
 $('slips').innerHTML=SOC.map(([id,k])=>{const sk=SK[k].find(x=>x[0]===id),o=S.skills[id];return `<button class="slip" data-sroll="${id}"><div class="sheet"><span class="n"><i class="dot ${o?'on':''}"></i>${sk[1]==='Проницательность'?'Проницат.':sk[1]}</span><span class="m">${sg(skMod(id))}</span><span class="h">${sk[2]}</span></div></button>`}).join('')
  +`<button class="slip pas" data-info="senses"><div class="sheet"><span class="n">Чутьё на ложь</span><span class="m">${pas('insight')}</span><span class="h">пассивная проницательность</span></div></button>`;
 $('langs').innerHTML=LANGS.map(([n,ex],i)=>`<button class="lang ${ex?'ex':''}" data-info="lang">${n}</button>`).join('');
 $('chars').innerHTML=['traits','ideal','bond','flaw'].map((k,i)=>`<button class="chr c${i+1}" data-info="ch_${k}"><b>${CHAR[k].t}</b><span>${CHAR[k].short}</span></button>`).join('');
}
function renderAll(){renderSocial();renderHead();renderSenses();renderAbil();renderFate();renderCoins();renderLog();if(openAb)renderDrawer();else if(openInfoKey)openInfo(openInfoKey,true)}

/* ---------- шторка характеристики ---------- */
function renderDrawer(){
 const k=openAb,[,n,s3]=ABN[k],m=mod(S.ab[k]),p=prof(),on=S.saves[k];
 let h=`<div class="dh"><img class="px" src="art/ab-${k}.webp" alt=""><h2>${n}</h2><div class="sc">значение<b>${S.ab[k]}</b></div></div>`;
 if(editing)h+=`<div class="edrow">Значение характеристики <input type="number" inputmode="numeric" id="abIn" value="${S.ab[k]}"> <span>нажимай на точки, чтобы менять владение</span></div>`;
 h+=`<div class="drows">`;
 h+=`<button class="row main" data-roll="check"><span class="dot" style="visibility:hidden"></span><span class="nm">Проверка: ${n}<small>просто ${n.toLowerCase()}, без навыка</small></span><span class="md">${sg(m)}</span>${d20i}</button>`;
 h+=`<button class="row main" data-roll="save"><span class="dot red ${on?'on':''}"></span><span class="nm">Спасбросок<small>${on?'владеешь':'не владеешь'}</small></span><span class="md">${sg(m+(on?p:0))}</span>${d20i}</button>`;
 SK[k].forEach(([id,nm,hint])=>{const o=S.skills[id];h+=`<button class="row" data-roll="${id}"><span class="dot ${o?'on':''}"></span><span class="nm">${nm}<small>${hint}</small></span>${o&&SRC[id]?`<span class="tag">${SRC[id]}</span>`:''}<span class="md">${sg(m+(o?p:0))}</span>${d20i}</button>`});
 if(!SK[k].length)h+=`<div class="row" style="color:var(--mute);font-size:14px">У Телосложения нет навыков. Его бросают на выносливость и удержание заклинаний.</div>`;
 h+=`</div>`;
 const pp=x=>10+m+(S.skills[x]?p:0);
 if(k==='wis')h+=`<div class="passive"><span>Пассивное восприятие <b>${pp('perception')}</b></span><span>Пассивная проницат. <b>${pp('insight')}</b></span></div>`;
 if(k==='int')h+=`<div class="passive"><span>Пассивный анализ <b>${pp('investigation')}</b></span></div>`;
 $('dbody').innerHTML=h;
}
function openDrawer(k){openAb=k;openInfoKey=null;renderDrawer();$('drawer').style.transform='';$('drawer').classList.add('on');$('dim').classList.add('on');vib(10)}
function closeDrawer(){openAb=null;openInfoKey=null;$('drawer').style.transform='';$('drawer').classList.remove('on');$('dim').classList.remove('on')}
$('dim').addEventListener('click',closeDrawer);
// шторку можно стянуть пальцем вниз
(function(){const d=$('drawer');let sy=0,dy=0,drag=false;
 d.addEventListener('pointerdown',e=>{const rows=e.target.closest('.drows');if(rows&&rows.scrollTop>0)return;sy=e.clientY;dy=0;drag=true;d.style.transition='none'});
 d.addEventListener('pointermove',e=>{if(!drag)return;dy=e.clientY-sy;if(dy>0)d.style.transform=`translateY(${dy}px)`;else d.style.transform=`translateY(${dy*.15}px)`});
 const end=()=>{if(!drag)return;drag=false;d.style.transition='';if(dy>90){closeDrawer()}else d.style.transform='';};
 d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
})();


/* ---------- кубик: вылетает из-под пальца, бьётся о стол ---------- */
const r=s=>1+Math.floor(Math.random()*s);
function dieSvg(n,tint){const a=tint==='dis'?['#5a1b26','#36101a']:['#5a2a4a','#33142c'];return `<svg viewBox="0 0 100 100"><defs><linearGradient id="g${tint}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a[0]}"/><stop offset=".55" stop-color="${a[1]}"/><stop offset="1" stop-color="#160912"/></linearGradient></defs>
 <path d="M50 4 L92 28 L92 72 L50 96 L8 72 L8 28Z" fill="url(#g${tint})" stroke="#e9bd6c" stroke-width="3" stroke-linejoin="round"/>
 <path d="M50 4 L26 46 L74 46Z M26 46 L50 96 M74 46 L50 96 M8 28 L26 46 M92 28 L74 46 M8 72 L26 46 M92 72 L74 46" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
 <text class="num" x="50" y="52">${n}</text></svg>`}
let busy=false,lastPt=null,cur=null;
document.addEventListener('pointerdown',e=>{lastPt={x:e.clientX,y:e.clientY};const c=e.target.closest('.ab,.tok,.fc,.row,.slip,.lang,.chr');if(c){c.classList.add('pressed');vib(6)}},{passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(()=>document.querySelectorAll('.pressed').forEach(c=>c.classList.remove('pressed')),60),{passive:true}));

function d20(spec){
 if(busy)return;
 let m=spec.mode||rollMode;
 if(chaosArmed){m=m==='dis'?'norm':'adv';chaosArmed=false;S.chaos.used=Math.min(S.chaos.max,S.chaos.used+1);save();renderFate();spec.note='Поток хаоса'}
 else if(inspArmed){m=m==='dis'?'norm':'adv';inspArmed=false;S.insp=0;save();renderFate();spec.note='Вдохновение'}
 const a=r(20),b=r(20);let used=a,other=null;
 if(m==='adv'){used=Math.max(a,b);other=Math.min(a,b)}else if(m==='dis'){used=Math.min(a,b);other=Math.max(a,b)}
 cur={spec,m,used,other,bonus:spec.bonus.reduce((s,x)=>s+x.v,0)};
 throwDie(20,used,other,m,showRes);
}
function dice(spec){
 if(busy)return;
 const rolls=Array.from({length:spec.n},()=>r(spec.s)),total=Math.max(spec.min??-99,rolls.reduce((a,b)=>a+b,0)+(spec.k||0));
 cur={dice:true};
 throwDie(spec.s,rolls.reduce((a,b)=>a+b,0),null,'norm',()=>{
  const res=$('res');res.innerHTML=`<div class="lbl">${esc(spec.label)}</div><div class="tot">${total}</div><div class="br">${spec.n}к${spec.s}: <b>${rolls.join(' + ')}</b>${spec.k?` ${spec.k>0?'+':'−'} ${Math.abs(spec.k)} ${spec.kl||''}`:''}</div>${spec.after?spec.after(total):''}<div class="hint">нажми, чтобы закрыть</div>`;
  res.classList.add('on');pushLog(spec.label,total);
 });
}
function throwDie(sides,final,other,m,done){
 busy=true;const ov=$('roll'),die=$('die'),shd=$('shd'),res=$('res');
 ov.classList.add('on');res.classList.remove('on');res.innerHTML='';ov.querySelectorAll('.dust,.die2').forEach(e=>e.remove());die.style.filter='';
 const W=innerWidth,H=innerHeight,sx=lastPt?lastPt.x:W/2,sy=lastPt?lastPt.y:H*.8,ex=W/2,ey=H/2-80;
 shd.style.left=ex+'px';shd.style.top=(ey+62)+'px';
 const dur=820,t0=performance.now(),spin=(sx<ex?1:-1)*(620+Math.random()*300),tint=m==='dis'?'dis':'n';let last=0,hit=0,hit2=0;
 function f(t){const k=Math.min(1,(t-t0)/dur);let x,y,sq=1,sc;
  if(k<.5){const q=k/.5;x=sx+(ex-sx)*q;y=sy+(ey-sy)*q-Math.sin(Math.PI*q)*Math.min(220,H*.28);sc=.45+.55*q+Math.sin(Math.PI*q)*.25}
  else if(k<.78){const q=(k-.5)/.28;x=ex;y=ey-50*Math.sin(Math.PI*q);sc=1+.06*Math.sin(Math.PI*q)}
  else{const q=(k-.78)/.22;x=ex;y=ey-9*Math.sin(Math.PI*q);sc=1}
  if(k>.49&&k<.56)sq=.8;else if(k>.77&&k<.81)sq=.92;
  die.style.transform=`translate(${x}px,${y}px) rotate(${spin*(1-Math.pow(1-k,2.6))}deg) scale(${sc/sq*.98+.02},${sc*sq})`;
  const air=Math.max(0,Math.min(1,(ey-y)/260));shd.style.opacity=k<.5?k*1.6*(1-air):1-air*.7;shd.style.transform=`scale(${1-air*.5})`;
  if(t-last>35+k*k*240&&k<.94){last=t;die.innerHTML=dieSvg(r(sides),tint)}
  if(!hit&&k>=.5){hit=1;vib(final===20?[30,40,70]:40);document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');dust(ex,ey+56,final===20&&sides===20)}
  if(!hit2&&k>=.78){hit2=1;vib(12)}
  if(k<1)requestAnimationFrame(f);else{
   die.innerHTML=dieSvg(final,tint);die.style.transform=`translate(${ex}px,${ey}px)`;
   if(sides===20&&final===20)die.style.filter='drop-shadow(0 0 26px #f6d58e)';
   if(sides===20&&final===1){die.style.filter='drop-shadow(0 0 18px #b3233a) grayscale(.5)'}
   if(other!=null){const d2=document.createElement('div');d2.className='die2';d2.innerHTML=dieSvg(other,'n');d2.style.left=(ex+92)+'px';d2.style.top=(ey-40)+'px';ov.appendChild(d2);d2.animate([{transform:'translate(-60px,20px) rotate(-90deg)',opacity:0},{transform:'none',opacity:.5}],{duration:300,easing:'cubic-bezier(.3,1.5,.5,1)'})}
   done();setTimeout(()=>busy=false,150);
  }}
 requestAnimationFrame(f);
}
function dust(x,y,gold){const ov=$('roll');for(let i=0;i<(gold?28:14);i++){const d=document.createElement('div');d.className='dust';d.style.left=x+'px';d.style.top=y+'px';if(gold)d.style.background=Math.random()<.5?'#f6d58e':'#fff';else d.style.opacity=.55;ov.appendChild(d);
 const dir=Math.random()<.5?-1:1,dx=dir*(30+Math.random()*90),dy=-(Math.random()*(gold?90:30));
 d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px)`,opacity:0}],{duration:420+Math.random()*380,easing:'cubic-bezier(.2,.8,.4,1)',fill:'forwards'})}}
function showRes(){
 const {spec,m,used,other,bonus}=cur,res=$('res'),total=used+bonus;
 const br=`к20 <b>${used}</b>`+(other!=null?` <span style="opacity:.6">(второй ${other}: ${m==='adv'?'преимущество':'помеха'})</span>`:'')+spec.bonus.filter(x=>x.v).map(x=>` ${x.v>=0?'+':'−'} ${Math.abs(x.v)} ${x.l}`).join('');
 const crit=used===20?'<div class="crit" style="color:var(--gold2)">Природная двадцатка!</div>':used===1?'<div class="crit" style="color:var(--red2)">Природная единица…</div>':'';
 const luckLeft=S.luck.max-S.luck.used;
 res.innerHTML=`<div class="lbl">${esc(spec.label)}${spec.note?` · ${spec.note}`:''}</div><div class="tot">${total}</div><div class="br">${br}</div>${crit}
  <div class="acts">${luckLeft?`<button data-luck>🍀 Везунчик: ещё к20 (осталось ${luckLeft})</button>`:''}</div><div class="hint">нажми мимо, чтобы закрыть</div>`;
 res.classList.add('on');pushLog(spec.label,total);
}
function useLuck(){
 if(!cur||cur.dice||busy)return;S.luck.used++;save();renderFate();
 const extra=r(20),{used,bonus,spec}=cur;
 lastPt={x:innerWidth*.5,y:innerHeight*.9};
 throwDie(20,extra,null,'n',()=>{
  $('res').innerHTML=`<div class="lbl">${esc(spec.label)} · Везунчик</div><div class="br" style="margin-top:6px">Выбери, какой кубик оставить</div>
  <div class="pick"><button data-pick="${used}" class="${used>=extra?'best':''}">прежний<b>${used+bonus}</b></button><button data-pick="${extra}" class="${extra>used?'best':''}">новый<b>${extra+bonus}</b></button></div>`;
  $('res').classList.add('on');
 });
}
function pushLog(l,t){S.log.unshift({l,t});S.log=S.log.slice(0,7);save();renderLog()}
$('roll').addEventListener('click',e=>{
 if(busy)return;
 if(e.target.closest('[data-luck]')){useLuck();return}
 const p=e.target.closest('[data-pick]');if(p){const v=+p.dataset.pick+cur.bonus;S.log[0]={l:cur.spec.label+' (Везунчик)',t:v};save();$('res').innerHTML=`<div class="lbl">${esc(cur.spec.label)}</div><div class="tot">${v}</div><div class="br">оставлен кубик <b>${p.dataset.pick}</b></div><div class="hint">нажми, чтобы закрыть</div>`;vib(15);return}
 if(e.target.closest('.res button'))return;
 $('roll').classList.remove('on');
});

function rollFromDrawer(what){
 const k=openAb,[,n,s3]=ABN[k],m=mod(S.ab[k]),b=[{l:s3,v:m}];
 if(what==='check')return d20({label:`Проверка: ${n}`,bonus:b});
 if(what==='save'){if(S.saves[k])b.push({l:'мастерство',v:prof()});return d20({label:`Спасбросок: ${n}`,bonus:b})}
 const sk=SK[k].find(x=>x[0]===what);if(S.skills[what])b.push({l:'мастерство',v:prof()});d20({label:sk[1],bonus:b});
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t||t.closest('#roll')||t.closest('#tabs')||t.closest('#mode')||t.closest('form'))return;
 if(t.dataset.ab)return openDrawer(t.dataset.ab);
 if(t.dataset.roll){
  if(editing){const w=t.dataset.roll;if(w==='save')S.saves[openAb]=S.saves[openAb]?0:1;else if(w!=='check')S.skills[w]=S.skills[w]?0:1;save();renderAll();vib(8);return}
  return rollFromDrawer(t.dataset.roll);
 }
 if(t.dataset.sroll)return rollSkill(t.dataset.sroll);
 if(t.dataset.coin){const k=t.dataset.coin;S.money[k]=Math.max(0,S.money[k]+ +t.dataset.d);save();renderCoins();vib(8);return}
 if(t.dataset.info)return openInfo(t.dataset.info);
 if(t.dataset.act)return act(t.dataset.act);
 if(t.id==='initTok')return d20({label:'Инициатива',bonus:[{l:'ЛОВ',v:mod(S.ab.dex)}]});
 if(t.id==='hpTok')return hpSheet();
 if(t.id==='editBtn')return editSheet();
});

 luck:()=>({t:'Везунчик',sub:'черта · 3 очка удачи',body:`<p>У тебя <b>3 очка удачи</b>. Осталось: <b>${S.luck.max-S.luck.used}</b>.</p>

 chaos:()=>({t:'Поток хаоса',sub:'дикая магия · 1 раз',body:`<p>Один раз можешь получить <b>преимущество</b> на один бросок <b>атаки, проверки или спасброска</b>. Преимущество значит: бросаешь два к20 и берёшь больший.</p>

 hd:()=>{const c=mod(S.ab.con),left=S.level-S.hd.used;return{t:'Кости хитов',sub:`к${S.hd.die} · ${left} из ${S.level}`,body:`<p>Это твой запас лечения на <b>короткий отдых</b> (час покоя: перевязать раны, перекусить). У тебя по одной кости <b>к${S.hd.die}</b> на каждый уровень, сейчас <b>${left} из ${S.level}</b>.</p>

  acts:`<button data-act="hdRoll" ${left?'':'disabled'}>Бросить кость и вылечиться</button>`}},

 short:()=>({t:'Короткий отдых',sub:'около часа',body:`<p>Час покоя: перевязать раны, поесть, отдышаться. Во время короткого отдыха можно тратить <b>кости хитов</b>, чтобы лечиться.</p>

 lang:()=>({t:'Языки',sub:'говоришь, читаешь и пишешь',body:LANGS.map(([n,ex,d])=>`<p><b>${n==='Инферн.'?'Инфернальный':n}</b>${ex?' <span class="mu">· редкий</span>':''}<br>${d}</p>`).join('')+`<div class="how">Бросать ничего не нужно: на этих языках ты просто понимаешь речь и тексты. Происхождение: Общий от рождения, Инфернальный от расы, Бездны и Драконий от предыстории.</div>`,acts:''}),

function act(a){
 const re=()=>{save();renderAll()};
 if(a==='luckSpend'){S.luck.used++;re();toast('Очко удачи потрачено');vib(15)}
 if(a==='luckBack'){S.luck.used=Math.max(0,S.luck.used-1);re()}
 if(a==='chaosOn'){chaosArmed=true;re();closeDrawer();toast('Следующий бросок будет с преимуществом');vib(15)}
 if(a==='chaosOff'){chaosArmed=false;re()}
 if(a==='chaosBack'){S.chaos.used=0;re();toast('Поток хаоса снова готов');vib(15)}
 if(a==='inspGet'){S.insp=1;re();vib(15)}
 if(a==='inspUse'){inspArmed=true;re();closeDrawer();toast('Следующий бросок будет с преимуществом');vib(15)}
 if(a==='inspOff'){inspArmed=false;re()}
 if(a==='inspGive'){S.insp=0;re()}
 if(a==='toHd')openInfo('hd',true);
 if(a==='hdRoll'){if(S.hd.used>=S.level)return;S.hd.used++;save();const c=mod(S.ab.con);
  dice({label:'Кость хитов',n:1,s:S.hd.die,k:c,kl:'ТЕЛ',min:1,after:v=>{const before=S.hp.cur;S.hp.cur=Math.min(S.hp.max,S.hp.cur+v);save();renderAll();return `<div class="br">хиты ${before} → <b>${S.hp.cur}</b></div>`}})}
 if(a==='longRest'){S.hp.cur=S.hp.max;S.hp.temp=0;S.luck.used=0;S.chaos.used=0;S.hd.used=Math.max(0,S.hd.used-Math.max(1,Math.floor(S.level/2)));save();closeDrawer();renderAll();flash('#hpTok','#86c79c');toast('Утро. Силы вернулись');vib([10,60,10])}
}
function hpSheet(){
 const f=$('form');f.innerHTML=`<h2>Хиты: ${S.hp.cur} из ${S.hp.max}</h2><input class="big" name="n" type="number" inputmode="numeric" placeholder="сколько?" required>
 <div class="two"><button class="go red" type="submit" value="dmg">− Урон</button><button class="go grn" type="submit" value="heal">+ Лечение</button></div>
 <button class="go" type="submit" value="temp" style="border:1px solid var(--violet);color:var(--violet)">Временные хиты</button>`;
 $('sheet').classList.add('on');setTimeout(()=>f.n.focus(),250);
 f.onsubmit=e=>{e.preventDefault();const n=Math.abs(parseInt(f.n.value));const how=e.submitter&&e.submitter.value;$('sheet').classList.remove('on');if(isNaN(n))return;
  if(how==='dmg'){let d=n;const t=Math.min(S.hp.temp,d);S.hp.temp-=t;d-=t;S.hp.cur=Math.max(0,S.hp.cur-d);flash('#hpTok','#e0485e');vib([40,30,20]);document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake')}
  else if(how==='heal'){S.hp.cur=Math.min(S.hp.max,S.hp.cur+n);flash('#hpTok','#86c79c');vib(15)}
  else{S.hp.temp=Math.max(S.hp.temp,n);flash('#hpTok','#a57cff')}
  save();renderHead();if(S.hp.cur===0)toast('0 хитов: Филипп без сознания. Спасброски от смерти');
 };
}
function editSheet(){
 const f=$('form');
 f.innerHTML=`<h2>Правка листа</h2>
 <div class="three"><label>Уровень<input name="level" type="number" inputmode="numeric" value="${S.level}"></label><label>Макс. хитов<input name="hp" type="number" inputmode="numeric" value="${S.hp.max}"></label><label>КД<input name="ac" type="number" inputmode="numeric" value="${S.ac}"></label></div>
 <div class="three">${AB.map(([k,n])=>`<label>${n}<input name="${k}" type="number" inputmode="numeric" value="${S.ab[k]}"></label>`).join('')}</div>
 <button class="go gold" type="submit">Сохранить</button>
 <button class="go" type="button" id="profBtn" style="border:1px solid var(--line);font-weight:500">${editing?'Выключить':'Включить'} правку владений</button>
 <p style="color:var(--mute);font-size:13px;margin:0;text-align:center">Правка владений: в шторке характеристики нажатие на навык включает или выключает владение, а не бросает кубик.</p>`;
 $('sheet').classList.add('on');
 $('profBtn').onclick=()=>{editing=!editing;$('editBtn').classList.toggle('on',editing);$('sheet').classList.remove('on');toast(editing?'Правка владений включена: открой характеристику и нажимай на навыки':'Правка владений выключена')};
 f.onsubmit=e=>{e.preventDefault();const g=n=>+f[n].value;
  S.level=Math.max(1,Math.min(20,g('level')||1));S.hp.max=Math.max(1,g('hp')||1);S.hp.cur=Math.min(S.hp.cur,S.hp.max);S.ac=g('ac')||10;
  AB.forEach(([k])=>S.ab[k]=Math.max(1,Math.min(30,g(k)||10)));save();renderAll();$('sheet').classList.remove('on');toast('Сохранено')};
}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on')});
function flash(sel,c){document.querySelector(sel).animate([{boxShadow:`0 0 0 2px ${c},0 0 28px ${c}`},{boxShadow:'0 0 0 0 transparent'}],{duration:700,easing:'ease-out'})}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

['mode','mode2'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rollMode=b.dataset.m;document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x.dataset.m===rollMode));vib(8)}));
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;closeDrawer();$('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));vib(6)});
function fit(){const ic=innerHeight<=600?46:innerHeight<=700?54:62;document.documentElement.style.setProperty('--ic',ic+'px')}
/* iPhone-ярлык на экране «Домой»: иногда система рисует страницу не до самого низа экрана,
   нижняя полоса остаётся пустой и туда ничего не нарисовать. Тогда полоска «Домой» лежит
   в этой пустоте, и лишний отступ под вкладками не нужен: прижимаем вкладки к краю рисунка. */
function fixGap(){const st=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 const portrait=innerHeight>innerWidth,full=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
 const g=st?full-innerHeight:0,r=document.documentElement.style;
 if(g>8&&g<140)r.setProperty('--sb','4px');else r.removeProperty('--sb')}
fixGap();addEventListener('resize',()=>{fixGap();fit()});addEventListener('orientationchange',()=>setTimeout(()=>{fixGap();fit()},300));
renderAll();fit();setTimeout(fit,300);
/* самообновление: сайт разрешает телефону держать старую копию до 10 минут.
   При открытии и при возврате в приложение тихо проверяем, нет ли версии новее, и сразу её грузим. */
const BUILD='2026-11-25-2';
function checkUpdate(){if(location.protocol==='file:')return;
 fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
  const m=t.match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
  let tried='';try{tried=sessionStorage.getItem('filipp-upd')||''}catch(e){}
  if(tried===m[1])return;try{sessionStorage.setItem('filipp-upd',m[1])}catch(e){}
  location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))}).catch(()=>{})}
checkUpdate();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
