<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Филипп</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="art/icon-180.png">
<link rel="icon" href="art/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Филипп">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* IDEA   один экран, готовый к игре: всё главное видно сразу, детали выезжают шторкой
   FEEL   лист проминается под пальцем, шторка тянется за пальцем, кубик вылетает из-под пальца и бьётся о стол
   ART    портрет Филиппа живёт в темноте за листом и встречает при запуске */
:root{color-scheme:dark;
 --bg:#0b080c;--bg2:rgba(20,15,22,.86);--ink:#ece4d8;--mute:#a39888;--line:rgba(236,228,216,.13);
 --paper:#d8ccb6;--paper2:#c4b597;--paperInk:#2a1d17;--paperMute:#6e5a48;
 --blood:#b3233a;--red2:#e0485e;--gold:#e9bd6c;--gold2:#f6d58e;--violet:#a57cff;--green:#86c79c;
 --gap:0px;--sb:max(env(safe-area-inset-bottom),var(--minsb,0px));--tabh:calc(54px + var(--sb))}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{margin:0;color:var(--ink);font:16px/1.4 Alegreya,Georgia,serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink);background:#0e0a0f;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;text-align:center;-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:600;line-height:1;margin:0}
.px{image-rendering:pixelated}

/* ===== портрет: фон и заставка ===== */
.bgart{position:fixed;inset:0 0 calc(-1*var(--gap)) 0;z-index:0;pointer-events:none;overflow:hidden}
.bgart img{position:absolute;right:-18%;top:-2%;height:78%;width:auto;max-width:none;opacity:.28;filter:saturate(.8);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.bgart::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 18%,rgba(11,8,12,.55) 60%,rgba(11,8,12,.2)),linear-gradient(0deg,var(--bg) 35%,transparent 70%)}
.flame{position:absolute;inset:0;mix-blend-mode:soft-light;background:radial-gradient(50% 35% at 70% 40%,rgba(255,190,110,.5),transparent 70%);animation:flick 3.2s infinite}
@keyframes flick{0%,100%{opacity:.8}12%{opacity:.55}20%{opacity:.95}43%{opacity:.65}61%{opacity:1}78%{opacity:.7}}
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:end center;transition:opacity .6s ease .1s}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;transition:transform 1s cubic-bezier(.3,0,.2,1)}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 8%,transparent 55%)}
.splash .t{position:relative;z-index:1;text-align:center;padding-bottom:16vh}
.splash h1{font-size:64px;font-weight:500;text-shadow:0 2px 20px #000}
.splash p{font:italic 500 19px "Cormorant Garamond",serif;color:#d9cdbb;margin:6px 0 0}
.splash.go{opacity:0;pointer-events:none}
.splash.go img{transform:scale(1.08) translateY(-2%)}

/* ===== экран ===== */
.page{position:fixed;inset:0 0 calc(var(--tabh) - var(--gap)) 0;z-index:1;display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page.on{display:block;animation:pg .28s ease-out}
.screen{height:calc(100svh + var(--gap) - var(--tabh));display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 12px 8px;gap:8px;max-width:560px;margin:0 auto}
.below{max-width:560px;margin:0 auto;padding:6px 14px 30px}
.below h2{font-size:22px;margin:4px 0 6px;color:var(--mute)}
.log{color:var(--mute);font-size:14px}
.log div{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log b{color:var(--ink);font-weight:500}
.fairbtn{margin-top:12px;color:var(--gold);font-size:14px;padding:6px 0}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;margin:8px 0 2px}
.hist i{flex:1;background:linear-gradient(0deg,#7b4dff,#d58cff);border-radius:2px 2px 0 0;min-height:1px}
.hist i.t{background:linear-gradient(0deg,#e9bd6c,#fff3cf)}
.hlab{display:flex;gap:2px;font-size:9.5px;color:var(--mute);text-align:center}.hlab span{flex:1}
.testmode{position:fixed;left:50%;top:calc(4px + env(safe-area-inset-top));transform:translateX(-50%);z-index:150;background:var(--blood);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px;pointer-events:none}
.senses{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sense{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:4px 6px;display:flex;align-items:center;gap:6px;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.sense b{font:700 21px/1 "Cormorant Garamond",serif;color:var(--gold2)}
.sense span{font-size:11.5px;line-height:1.1;color:var(--mute);text-align:left}
.info{padding:2px 6px 10px;font-size:15.5px;line-height:1.45;color:#ddd3c4}
.info p{margin:0 0 9px}
.info b{color:var(--gold2);font-weight:500}
.info .mu{color:var(--mute);font-size:13px}
.info .how{background:rgba(233,189,108,.07);border-left:3px solid var(--gold);border-radius:8px;padding:8px 10px;margin:4px 0 10px;font-size:14.5px}
.dacts{flex:none;display:grid;gap:8px;padding-top:4px}
.dacts button{border-radius:14px;padding:13px;font-weight:700;font-size:16px;background:var(--gold);color:#1b1208}
.dacts button.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.dacts button:disabled{opacity:.4}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}

.head{display:flex;align-items:center;gap:10px}
.head .face{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover}
.head .who{flex:1;line-height:1.15}
.head h1{font-size:26px;font-weight:600}
.head .cls{font:italic 500 14px "Cormorant Garamond",serif;color:var(--mute)}
.head .cls b{color:var(--gold);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,15,22,.7);border:1px solid var(--line)}
.iconbtn.on{background:var(--gold);color:#1b1208}

.vit{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px}
.tok{background:linear-gradient(160deg,rgba(36,26,36,.92),rgba(21,15,22,.92));border:1px solid rgba(233,189,108,.22);border-radius:14px;padding:6px 4px 6px;text-align:center;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.tok .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tok .v{font:700 24px/1.05 "Cormorant Garamond",serif}
.tok .v small{font-size:14px;color:var(--mute);font-weight:600}
.tok.hp{text-align:left;padding-left:10px}
.hpbar{height:4px;background:#2b1c24;border-radius:3px;margin-top:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#7d1426,var(--red2));transition:width .45s cubic-bezier(.3,1.5,.5,1)}
.tok .temp{color:var(--violet);font-size:14px}

.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px}
.mode button{padding:4px 2px;border-radius:8px;font-size:12.5px;color:var(--mute);border:1px solid transparent;background:none;transition:.15s}
.mode button.on{color:var(--ink);border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(233,189,108,.35)}
.mode button.on[data-m="adv"]{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 0 1px rgba(134,199,156,.35),0 0 12px rgba(134,199,156,.2)}
.mode button.on[data-m="dis"]{border-color:var(--red2);color:var(--red2);box-shadow:inset 0 0 0 1px rgba(224,72,94,.35),0 0 12px rgba(224,72,94,.2)}

/* характеристики: клочки бумаги, растягиваются по свободной высоте */
.abil{flex:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:8px 8px;padding:2px 0}
.spare{flex:1 1 auto;min-height:0}
.ab{position:relative;color:var(--paperInk);filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));transition:transform .12s cubic-bezier(.3,1.6,.5,1);display:flex;min-height:0}
.ab .sheet{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px;text-align:center;background:
  radial-gradient(120% 90% at 30% 10%,rgba(255,250,235,.55),transparent 55%),
  radial-gradient(90% 70% at 90% 100%,rgba(120,80,40,.28),transparent 60%),
  linear-gradient(170deg,var(--paper),var(--paper2));
  clip-path:polygon(2% 3%,22% 0,41% 2.5%,63% .5%,84% 2.8%,99% 1%,97.5% 24%,100% 47%,98% 71%,99.5% 97%,79% 99%,58% 97.5%,37% 100%,18% 98%,1% 99.5%,2.5% 75%,0 52%,2% 28%)}
.ab:nth-child(2n) .sheet{transform:rotate(.8deg)}.ab:nth-child(3n) .sheet{transform:rotate(-.6deg)}
.ab .ic{width:var(--ic,48px);height:var(--ic,48px);flex:none;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.ab .nm{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:3px;white-space:nowrap}
.ab .n{font:600 14px/1 "Cormorant Garamond",serif}
.ab .m{font:700 26px/1 "Cormorant Garamond",serif}
.ab .s{font-size:11.5px;color:var(--paperMute);margin-top:2px;display:flex;gap:4px;align-items:center}
.ab .s .dot{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--paperMute)}
.ab .s .dot.on{background:var(--blood);border-color:var(--blood)}
.it.pressed,.atk.pressed,.sp.pressed,.cnd.pressed,.slip.pressed,.lang.pressed,.chr.pressed,.pressed{transform:scale(.93) translateY(2px)!important}

/* судьба */
.fate{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fc{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:5px 10px;min-height:40px;text-align:left;display:flex;align-items:center;gap:8px;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.fc .t{font:600 16.5px/1.05 "Cormorant Garamond",serif;flex:1}
.fc .t small{display:block;font:400 11.5px/1.2 Alegreya,serif;color:var(--mute);margin-top:2px}
.fc .ch{display:flex;gap:5px}
.charge{width:14px;height:14px;transform:rotate(45deg);border-radius:3px;border:1.6px solid var(--gold);background:radial-gradient(circle at 35% 35%,#fff3cf,var(--gold) 55%,#8d6020);box-shadow:0 0 8px rgba(233,189,108,.5);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.charge.v{border-color:var(--violet);background:radial-gradient(circle at 35% 35%,#e3d4ff,var(--violet) 55%,#4b2c8f);box-shadow:0 0 8px rgba(165,124,255,.55)}
.charge.r{border-color:var(--red2);background:radial-gradient(circle at 35% 35%,#ffc2cb,var(--red2) 55%,#6e1222);box-shadow:0 0 8px rgba(224,72,94,.5)}
.charge.used{background:#120d13;box-shadow:none;border-color:#4a3d36;transform:rotate(45deg) scale(.75)}
.fc.armed{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 18px rgba(165,124,255,.35)}
.fc.rest{justify-content:center;min-height:34px;padding:3px 8px}
.fc.rest .t{font-size:15px}
.fc.rest .t{flex:none;text-align:center}

/* ===== состояния ===== */
.spare{display:flex;flex-direction:column;gap:5px;overflow:hidden}
.cnh{display:flex;align-items:center;gap:8px;font:600 11px/1 Alegreya,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cnh i{flex:1;height:1px;background:var(--line)}
.cnh button{font:600 12px/1 Alegreya,serif;letter-spacing:.04em;text-transform:none;color:var(--gold);padding:4px 2px}
.cnds{display:flex;flex-wrap:wrap;gap:6px;overflow:hidden;min-height:0;align-content:flex-start}
.cnd{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:600 15px/1 "Cormorant Garamond",serif;color:var(--mute);transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.cnd.on{color:#ffe3e7;border-color:var(--red2);background:linear-gradient(160deg,rgba(120,20,38,.55),rgba(50,10,20,.6));box-shadow:0 0 0 1px rgba(224,72,94,.35),0 0 14px rgba(224,72,94,.35)}
.cnd.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red2);margin-right:6px;vertical-align:middle;box-shadow:0 0 6px var(--red2)}
.cnd.more{display:none;color:var(--gold)}
.cnd.stamp{animation:stamp .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(1.35) rotate(-3deg);opacity:.4}60%{transform:scale(.94)}100%{transform:none}}
.crow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 4px;border-top:1px solid var(--line);text-align:left;font-size:16px}
.crow small{color:var(--mute);font-size:12.5px}
.crow.on{color:#ffb3bf}
.crow.ck.on{color:var(--ink)}
.crow .box{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid #6f6458;border-radius:6px;margin-right:10px;font-style:normal;font-size:13px;color:#1a1310;vertical-align:-3px;transition:.15s}
.crow.ck.on .box{background:var(--gold);border-color:var(--gold)}
.crow.on small{color:var(--red2)}
.warn{color:var(--red2)!important}

/* ===== магия в разговоре ===== */
.smag{flex:none;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.smh{white-space:nowrap;display:flex;align-items:center;gap:8px;font:600 11px/1 Alegreya,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.smh i{flex:1;height:1px;background:var(--line)}
.smh .dc{text-transform:none;letter-spacing:0;color:var(--violet);font-size:12.5px;padding:4px 0}
.sp.more{grid-column:1/-1;text-align:center;background:none;border:1px dashed rgba(165,124,255,.35);color:var(--violet);font-size:13px;line-height:1.1;padding:3px}
.sp b,.sp small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smh .sl{display:flex;gap:4px}
.smh .sl .charge{width:10px;height:10px}
.spl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sp{background:linear-gradient(160deg,rgba(40,26,52,.9),rgba(22,15,28,.9));border:1px solid rgba(165,124,255,.28);border-radius:12px;padding:7px 10px;text-align:left;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.sp b{display:block;font:600 16px/1.05 "Cormorant Garamond",serif;color:#eadcff}
.sp small{display:block;font-size:11px;line-height:1.15;color:var(--mute);margin-top:2px}
.sp.lv b::after{content:" · 1 круг";font:400 11px Alegreya,serif;color:var(--violet)}
.sp.on{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 16px rgba(165,124,255,.4)}
.sp.on small{color:#d9c6ff}
@media (max-height:760px){.sp small{display:none}.sp{padding:6px 8px}.sp b{font-size:15px}.spl{grid-template-columns:repeat(3,1fr)}.sp.lv b::after{content:" •";color:var(--violet)}.fc.heart small{display:none}#p-social .screen{gap:6px}}
@media (max-height:600px){.sp b{font-size:14px}.sp{padding:5px 7px}.smh .lg,.smh.lgh{display:none}}

/* ===== общение ===== */
.shead{display:flex;align-items:center;gap:10px}
.shead img{width:40px;height:40px}
.shead h1{font-size:28px;font-weight:500}
.shead .cls{font:italic 500 15px "Cormorant Garamond",serif;color:var(--gold)}
.slips{flex:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:7px 7px}
.slip{position:relative;display:flex;min-height:0;color:var(--paperInk);filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.slip .sheet{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 5px 7px;text-align:center;background:
  radial-gradient(120% 90% at 30% 10%,rgba(255,250,235,.55),transparent 55%),radial-gradient(90% 70% at 90% 100%,rgba(120,80,40,.28),transparent 60%),linear-gradient(170deg,var(--paper),var(--paper2));
  clip-path:polygon(1% 4%,24% 0,47% 3%,71% .5%,99% 2.5%,97.5% 30%,100% 62%,98.5% 97%,73% 99.5%,49% 97%,26% 100%,1.5% 98%,0 66%,2% 34%)}
.slip:nth-child(2n) .sheet{transform:rotate(-.7deg)}.slip:nth-child(3n) .sheet{transform:rotate(.6deg)}
.slip .n{font:600 15px/1.05 "Cormorant Garamond",serif;display:flex;align-items:center;gap:4px}
.slip .n .dot{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--paperMute);flex:none}
.slip .n .dot.on{background:var(--gold);border-color:#a8782c;box-shadow:0 0 6px rgba(233,189,108,.6)}
.slip .top{display:flex;align-items:baseline;justify-content:center;gap:5px;white-space:nowrap}
.slip .m{font:700 24px/1 "Cormorant Garamond",serif}
.slip .h{font-size:10.5px;line-height:1.1;color:var(--paperMute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slip.pas .sheet{background:linear-gradient(170deg,#2a2029,#1a1319);clip-path:none;border:1px dashed rgba(233,189,108,.35);border-radius:12px;color:var(--ink)}
.slip.pas .h{color:var(--mute)}
.fc.heart{min-height:42px}
.fc.heart .eye{color:var(--blood);font-size:18px;text-shadow:0 0 10px rgba(179,35,58,.7)}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lang{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 2px;font:600 14px/1 "Cormorant Garamond",serif;text-align:center;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.lang.ex{color:#d9a0ff;border-color:rgba(165,124,255,.35)}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chr{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:6px 9px;text-align:left;min-height:0;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.chr b{display:block;font:600 11px/1 Alegreya,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.chr span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:500 14.5px/1.12 "Cormorant Garamond",serif}
.chr.c2{border-left-color:var(--violet)}.chr.c3{border-left-color:var(--blood)}.chr.c4{border-left-color:#6f6458}
@media (max-height:700px){.cnd{padding:5px 8px;font-size:14px}.spare{gap:3px}}
@media (max-height:700px){.shead img{width:32px;height:32px}.shead h1{font-size:23px}.chr{padding:4px 8px}.lang{padding:4px 2px}.fc.heart{min-height:36px}}
.smag .spl{overflow:hidden}.spl .sp b{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.02}
@media (max-height:600px){.cnh{display:none}.cnds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.cnds::-webkit-scrollbar{display:none}.cnd{flex:none}.cnd.more{display:block}.sp small{display:none}.sp{padding:6px 9px}.slip .h{display:none}.shead .cls{display:none}}

/* заглушки */
/* бой */
#p-fight .shead{position:relative}
.turnq{margin-left:auto;align-self:flex-start;font:italic 500 14px "Cormorant Garamond",serif;color:var(--gold);padding:4px 0}
.fvit{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px}
.fvit .tok .k{font-size:9px;letter-spacing:.04em;line-height:1.1;min-height:20px;display:flex;align-items:center;justify-content:center}
.fvit .tok.hp .k{justify-content:flex-start}

/* ---------- эффекты заклинаний: у каждой стихии свой материал ---------- */
.fxb{position:relative;isolation:isolate;overflow:hidden}
.fxl{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:inherit}
.fxl s,.fxl u{position:absolute;display:block;text-decoration:none}
.orbs button:not(.on) .fxl{opacity:.5}
/* огонь: край тлеет, как бумага от свечи, угольки отрываются и гаснут */
.fxl .burn{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(255,110,30,.26),rgba(255,110,30,0));animation:fheat 2.2s ease-in-out infinite}
.fxl .burn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#ffb347 12%,#fff0b0 38%,#ff8a2a 58%,#ffcf6a 80%,transparent);box-shadow:0 0 6px #ff8a2a;animation:frim 1.2s steps(3) infinite}
.solid .fxl .burn{background:linear-gradient(to top,rgba(70,16,4,.5),rgba(150,50,12,.18) 45%,transparent)}
@keyframes fheat{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes frim{0%{opacity:1}33%{opacity:.65}66%{opacity:.9}}
.fx-fire .fxl s{bottom:0;width:3px;height:3px;background:#ffd36a;box-shadow:0 0 3px #ff7a1a;opacity:0;animation:fember 2.6s linear infinite}

const SK={
 str:[['athletics','Атлетика','лазать, плыть, прыгать, толкать']],
 dex:[['acrobatics','Акробатика','удержать равновесие, кувырок'],['sleight','Ловкость рук','стянуть, подбросить, спрятать'],['stealth','Скрытность','прятаться, красться']],

 int:[['arcana','Магия','заклинания, магические знаки'],['investigation','Анализ','найти улику, понять механизм'],['history','История','события, рода, легенды'],['religion','Религия','боги, нежить, обряды'],['nature','Природа','звери, травы, погода']],

 prone:{n:'Сбит с ног',fx:{atk:'dis'},d:'<p>• Ты лежишь ничком. Можешь только ползти (каждый метр стоит 2 м скорости), пока не встанешь. Встать стоит половину скорости.</p><p>• Твои атаки с <b>помехой</b>.</p><p>• Атаки по тебе с <b>преимуществом</b>, если враг в пределах 1,5 м. Если дальше, то с помехой.</p>'},

 blinded:{n:'Ослеплён',fx:{atk:'dis'},d:'<p>• Ты ничего не видишь и автоматически проваливаешь проверки, где нужно зрение.</p><p>• Твои атаки с <b>помехой</b>, атаки по тебе с <b>преимуществом</b>.</p>'},
 deafened:{n:'Оглох',fx:{},d:'<p>• Ты ничего не слышишь и автоматически проваливаешь проверки, где нужен слух.</p>'},
 incapacitated:{n:'Недееспособен',fx:{},d:'<p>• Ты не можешь совершать <b>действия и реакции</b>.</p>'},
 invisible:{n:'Невидим',fx:{atk:'adv'},d:'<p>• Тебя нельзя увидеть без магии или особого чувства. Тебя всё ещё можно услышать или найти по следам.</p><p>• Твои атаки с <b>преимуществом</b>, атаки по тебе с <b>помехой</b>.</p>'},
 paralyzed:{n:'Парализован',fx:{spd0:1,fail:1},d:'<p>• Ты <b>недееспособен</b>: нет действий и реакций. Не можешь двигаться и говорить.</p><p>• <b>Автоматически проваливаешь</b> спасброски Силы и Ловкости.</p><p>• Атаки по тебе с <b>преимуществом</b>. Попадание с 1,5 м становится <b>критическим</b>.</p>'},
 stunned:{n:'Ошеломлён',fx:{spd0:1,fail:1},d:'<p>• Ты <b>недееспособен</b>, не можешь двигаться, говоришь запинаясь.</p><p>• <b>Автоматически проваливаешь</b> спасброски Силы и Ловкости.</p><p>• Атаки по тебе с <b>преимуществом</b>.</p>'},
 unconscious:{n:'Без сознания',fx:{spd0:1,fail:1},d:'<p>• Ты <b>недееспособен</b>, не двигаешься, не говоришь и не понимаешь, что вокруг. Роняешь то, что держал, и падаешь ничком.</p><p>• <b>Автоматически проваливаешь</b> спасброски Силы и Ловкости.</p><p>• Атаки по тебе с <b>преимуществом</b>. Попадание с 1,5 м становится <b>критическим</b>.</p>'},
 petrified:{n:'Окаменел',fx:{spd0:1,fail:1},d:'<p>• Ты превращён в камень вместе с вещами, весишь в 10 раз больше, не стареешь.</p><p>• <b>Недееспособен</b>, не двигаешься, не говоришь, не понимаешь, что вокруг.</p><p>• <b>Автоматически проваливаешь</b> спасброски Силы и Ловкости. Атаки по тебе с <b>преимуществом</b>.</p><p>• <b>Сопротивление</b> всем видам урона, иммунитет к яду и болезням (уже действующие замирают).</p>'}
};
const COND_MAIN=['frightened','poisoned','charmed','prone','grappled','restrained','blinded','deafened','incapacitated','invisible','exh'];
const EXH=['нет','помеха на проверки характеристик','скорость вдвое меньше','помеха на атаки и спасброски','максимум хитов вдвое меньше','скорость 0','смерть'];
function condFx(spec){const dis=[],adv=[];let fail=null;const C=S.cond||{},kind=spec.kind,ab=spec.ab;
 for(const k in C){if(!C[k]||!COND[k])continue;const f=COND[k].fx,n=COND[k].n;
  if(kind==='check'&&f.chk==='dis')dis.push(n);
  if(kind==='atk'&&f.atk==='dis')dis.push(n);if(kind==='atk'&&f.atk==='adv')adv.push(n);
  if(kind==='save'&&ab==='dex'&&f.svdex==='dis')dis.push(n);

 if(S.conc==='friends'&&kind==='check'&&ab==='cha')adv.push('Дружба');
 if(spec.conc&&hasFeat('war_caster'))adv.push('Боевой заклинатель');
 const e=S.exh||0;if(e>=1&&kind==='check')dis.push('Истощение');if(e>=3&&(kind==='atk'||kind==='save'))dis.push('Истощение');
 return{dis,adv,fail}}
function effSpeed(){const C=S.cond||{},e=S.exh||0;if(e>=5||Object.keys(C).some(k=>C[k]&&COND[k]&&COND[k].fx.spd0))return 0;return e>=2?S.speed/2:S.speed}

/* нажатие на значок сразу включает/выключает состояние; порядок постоянный, как в списке.

const CORDER=[...Object.keys(COND),'exh'];
function cndOn(k){return k==='exh'?S.exh>0:!!S.cond[k]}
function renderConds(){const show=CORDER.filter(k=>S.condShow.includes(k)||cndOn(k)),n=CORDER.filter(cndOn).length;
 $('spare').innerHTML=`<div class="cnh">Состояния${n?` · <span class="warn">${n}</span>`:''}<i></i><button data-info="conds">все ›</button></div><div class="cnds">${show.map(k=>`<button class="cnd ${cndOn(k)?'on':''}" data-cnd="${k}">${k==='exh'?'Истощение'+(S.exh?' '+S.exh:''):COND[k].n}</button>`).join('')}<button class="cnd more" data-info="conds">все ›</button></div>`}
function toggleCnd(k){if(k==='exh')S.exh=S.exh>=6?0:S.exh+1;else if(S.cond[k])delete S.cond[k];else S.cond[k]=1;
 save();renderAll();const on=cndOn(k);vib(on?[20,40,30]:10);
 const c=document.querySelector(`.cnd[data-cnd="${k}"]`);if(c&&on){c.classList.remove('stamp');void c.offsetWidth;c.classList.add('stamp')}}

const slotsTot=()=>S.slots.max+(S.slots.extra||0),slotsLeft=()=>slotsTot()-S.slots.used;
function useSlot(){if(slotsLeft()<=0)return false;if(S.slots.extra>0)S.slots.extra--;else S.slots.used++;return true}

const cantN=()=>1+(S.level>=5)+(S.level>=11)+(S.level>=17);
const hiC=()=>S.hi?Object.keys(S.hi).map(Number).sort((a,b)=>a-b):[];
function cTot(c){if(c===1)return slotsTot();const h=S.hi&&S.hi[c];return h?h.max+(h.extra||0):0}

function firstC(lv){for(let c=Math.max(1,lv);c<=9;c++)if(cLeft(c)>0)return c;return 0}
function useSlotC(c){if(c===1)return useSlot();const h=S.hi&&S.hi[c];if(!h||cLeft(c)<=0)return false;if(h.extra>0)h.extra--;else h.used++;return true}
const FONT={2:3,3:5,4:6,5:7};
const effAC=()=>(S.mArm?Math.max(S.ac,13+mod(S.ab.dex)):S.ac)+(S.shieldOn?5:0);

 friends:{n:'Дружба',lv:0,soc:1,conc:1,short:'преимущество на Харизму к одному',meta:'заговор · 1 действие · на себя · концентрация до 1 мин · С, М (грим)',
  d:()=>`<p>Пока заклинание действует, у тебя <b>преимущество на все проверки Харизмы</b> (Обман, Убеждение, Запугивание, Выступление) против <b>одного</b> существа, которое к тебе не враждебно.</p><p>Когда заклинание кончается, существо <b>понимает, что ты влиял на него магией</b>, и становится к тебе враждебным. Склонное к насилию может напасть, другое потребует расплаты, как решит мастер.</p>`},
 minor_illusion:{n:'Малая иллюзия',lv:0,soc:1,short:'звук или образ предмета',meta:'заговор · 1 действие · 9 м · 1 минута · С, М (овечья шерсть)',
  d:()=>`<p>Ты создаёшь <b>звук</b> или <b>образ предмета</b> в пределах 9 м на 1 минуту.</p><p><b>Звук</b>: от шёпота до крика. Твой голос, чужой голос, рык, барабаны, что угодно. Может звучать всё время или отдельными звуками.</p><p><b>Образ</b>: предмет не больше куба 1,5 м (стул, сундук, след в грязи). Без звука, света и запаха. Если до него дотронуться, рука пройдёт насквозь, и обман раскроется.</p><p>Существо может действием изучить иллюзию: проверка Интеллекта (Анализ) против <b>Сл ${spellDC()}</b>. Если поняло, иллюзия для него становится полупрозрачной.</p>`},
 message:{n:'Сообщение',lv:0,soc:1,short:'шёпот, который слышит только цель',meta:'заговор · 1 действие · 36 м · 1 раунд · В, С, М (медная проволока)',
  d:()=>`<p>Ты указываешь на существо в пределах 36 м и <b>шепчешь послание</b>. Слышит только цель, и она может так же шёпотом ответить, а услышишь только ты.</p><p>Работает сквозь стены, если ты знаешь цель и знаешь, что она там. Огибает углы. Не пройдёт через магическую тишину, 30 см камня, 2,5 см металла, тонкий свинец или 90 см дерева.</p>`},
 fire_bolt:{n:'Огненный снаряд',lv:0,fight:1,atk:1,hit:()=>cantN()+'к10 огнём',where:'36 м',short:'атака огнём',meta:'заговор · 1 действие · 36 м · мгновенно · В, С',
  d:()=>`<p>Ты бросаешь сгусток огня в существо или предмет в пределах 36 м. Это <b>дальнобойная атака заклинанием: к20 ${sg(spellAtk())}</b>. При попадании <b>${cantN()}к10 урона огнём</b>${cantN()>1?' (заговор растёт с уровнем)':''}. Горючие предметы, которые никто не держит, загораются.</p>`},
 charm_person:{n:'Очарование личности',lv:1,soc:1,short:'гуманоид считает тебя другом, 1 час',meta:'1 круг · 1 действие · 9 м · 1 час · В, С',
  d:()=>`<p>Ты пытаешься очаровать <b>гуманоида</b>, которого видишь в пределах 9 м. Он делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>. С преимуществом, если ты или твои спутники с ним сражаетесь.</p><p>При провале он <b>очарован на 1 час</b> или пока ты или спутники не причините ему вред. Очарованный <b>считает тебя другом</b>.</p><p>Когда заклинание кончится, он <b>знает, что ты его очаровал</b>.</p><p class="mu">Ячейкой 2 круга и выше: +1 цель за каждый круг выше первого (цели в 9 м друг от друга).</p>`},
 shield:{n:'Щит',lv:1,fight:1,react:1,short:'+5 к КД до твоего хода, реакция',meta:'1 круг · реакция · на себя · 1 раунд · В, С',
  d:()=>`<p>Реакция: когда по тебе <b>попадает атака</b> или ты становишься целью <b>волшебной стрелы</b>.</p><p>Перед тобой встаёт невидимый барьер. До начала твоего следующего хода у тебя <b>+5 к КД</b>, в том числе против той самой атаки, и ты <b>не получаешь урон от волшебной стрелы</b>.</p>`},
 chromatic_orb:{n:'Цветной шарик',lv:1,fight:1,atk:1,hit:()=>'3к8 '+ORBDMG[S.orbT],where:'27 м',short:'атака 3к8 урона, стихия на выбор',meta:'1 круг · 1 действие · 27 м · мгновенно · В, С, М (бриллиант 50 зм)',
  d:()=>`<p>Ты бросаешь сферу энергии в существо в пределах 27 м. Выбери вид урона: <b>звук, кислота, огонь, холод, электричество или яд</b>.</p><p>Это <b>дальнобойная атака заклинанием: к20 ${sg(spellAtk())}</b>. При попадании <b>3к8 урона</b> выбранного вида.</p><p class="mu">Нужен бриллиант стоимостью 50 зм (он не тратится). Ячейкой 2 круга и выше: +1к8 за каждый круг выше первого.</p>`},
 disguise_self:{n:'Маскировка',lv:1,soc:1,short:'другая внешность на 1 час',meta:'1 круг · 1 действие · на себя · 1 час · В, С',
  d:()=>`<p>Ты и всё твоё снаряжение <b>выглядите иначе</b> на 1 час, или пока ты не закончишь действием. Можно стать на 30 см выше или ниже, худее или полнее. Нельзя менять строение тела: столько же рук и ног.</p><p>Иллюзия не выдерживает касания: рука пройдёт сквозь шляпу или упрётся в тебя раньше, чем ждёт.</p><p>Чтобы раскусить, существо должно действием тебя изучить и пройти проверку Интеллекта (Анализ) против <b>Сл ${spellDC()}</b>.</p>`},
 mage_hand:{n:'Волшебная рука',lv:0,short:'призрачная рука до 9 м',meta:'заговор · 1 действие · 9 м · 1 минута · В, С',
  d:()=>`<p>В точке до 9 м появляется <b>призрачная парящая рука</b> на 1 минуту. Действием ты двигаешь её до 9 м и делаешь ею что-то простое: открыть незапертую дверь, достать вещь из сундука, вылить флягу.</p><p>Рука поднимает не больше <b>5 кг</b>. Она не атакует, не включает магические предметы и не уходит дальше 9 м от тебя.</p>`},
 prestidigitation:{n:'Фокусы',lv:0,soc:1,short:'мелкое волшебство: искра, запах, чистота',meta:'заговор · 1 действие · 3 м · до 1 часа · В, С',
  d:()=>`<p>Мелкий трюк в пределах 3 м, на выбор:</p><p>• безвредные искры, дуновение ветра, тихая музыка или запах;<br>• зажечь или погасить свечу, факел, костерок;<br>• мгновенно почистить или испачкать предмет до 30 см;<br>• остудить, согреть или придать вкус еде на 1 час;<br>• цвет, пятнышко или знак на предмете или поверхности на 1 час;<br>• в руке появляется крохотная безделушка или иллюзорный образ до конца твоего следующего хода.</p><p class="mu">Одновременно действует до трёх эффектов.</p>`},
 suggestion:{n:'Внушение',lv:2,soc:1,conc:1,short:'цель делает то, что ты предложил',meta:'2 круг · 1 действие · 9 м · концентрация до 8 часов · В, М (змеиный язык и мёд)',
  d:()=>`<p>Ты внушаешь существу в пределах 9 м, которое тебя слышит и понимает, <b>разумный образ действий</b> одной-двумя фразами. Оно делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>.</p><p>При провале существо следует внушению, пока длится заклинание. Явно опасное для него внушение не сработает, а вот «сторожи этот мост» или «отдай мне ключ, это для твоего же блага» сработает.</p><p class="mu">Существа, которых нельзя очаровать, не подвержены. Если ты или спутники ранят цель, заклинание кончается.</p>`},
 misty_step:{n:'Туманный шаг',lv:2,fight:1,where:'на себя',short:'телепорт на 9 м, бонусное действие',meta:'2 круг · бонусное действие · на себя · мгновенно · В',
  d:()=>`<p>Тебя окутывает серебристый туман, и ты <b>телепортируешься</b> до 9 м в свободное место, которое видишь.</p><p class="mu">Это бонусное действие: в тот же ход можно ещё сотворить заговор действием. Уход телепортом не провоцирует Удар вслед.</p>`},
 hold_person:{n:'Удержание личности',lv:2,fight:1,conc:1,where:'18 м',short:'гуманоид парализован',meta:'2 круг · 1 действие · 18 м · концентрация до 1 минуты · В, С, М (кусочек железа)',
  d:()=>`<p>Выбери <b>гуманоида</b>, которого видишь в пределах 18 м. Он делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>. При провале он <b>парализован</b>: не двигается, не действует, атаки по нему с преимуществом, а удар вплотную становится критическим.</p><p>В конце каждого своего хода цель снова делает спасбросок и при успехе освобождается.</p><p><b>Ячейкой выше 2 круга</b>: ещё одна цель за каждый круг выше, все в пределах 9 м друг от друга.</p>`},
 /* ---- 2 круг чародея (PHB 2014): остальные 21 заклинание ---- */
 alter_self:{n:'Смена обличья',lv:2,soc:1,conc:1,where:'на себя',short:'жабры, другая внешность или когти',meta:'2 круг · 1 действие · на себя · концентрация до 1 часа · В, С',
  d:()=>`<p>Ты меняешь своё тело. Выбери один вариант. Пока заклинание длится, можешь <b>действием</b> сменить его на другой.</p><p><b>Водная адаптация.</b> У тебя появляются жабры и перепонки: дышишь под водой, плаваешь со скоростью, равной обычной.</p><p><b>Другая внешность.</b> Меняешь рост, вес, черты лица, голос, длину и цвет волос, отличительные приметы. Можешь выглядеть как существо другой расы, но строение тела остаётся твоим: ты остаёшься гуманоидом того же размера. Держится, пока не сменишь вариант.</p><p><b>Природное оружие.</b> Отращиваешь когти, клыки, шипы, рога или что-то такое. Безоружные удары ими наносят <b>1к6</b> урона (колющего, рубящего или дробящего, по виду оружия) плюс Сила. Это оружие магическое, к его атакам и урону <b>+1</b>.</p>`},
 blindness_deafness:{n:'Глухота/слепота',lv:2,fight:1,where:'9 м',short:'цель слепнет или глохнет на минуту',meta:'2 круг · 1 действие · 9 м · 1 минута · В',
  d:()=>`<p>Выбери существо в пределах 9 м, которое видишь. Оно делает <b>спасбросок Телосложения против Сл ${spellDC()}</b>. При провале оно <b>ослеплено</b> или <b>оглохло</b> (выбираешь ты) на 1 минуту.</p><p>В конце каждого своего хода цель повторяет спасбросок и при успехе освобождается.</p><p class="mu">Концентрации не нужно. Ячейкой 3 круга и выше: +1 цель за каждый круг выше второго.</p>`},
 blur:{n:'Размытый образ',lv:2,fight:1,conc:1,where:'на себя',short:'атаки по тебе с помехой',meta:'2 круг · 1 действие · на себя · концентрация до 1 минуты · В',
  d:()=>`<p>Твоё тело расплывается, колышется, как марево. Пока заклинание длится, <b>все атаки по тебе с помехой</b>.</p><p class="mu">Не действует на тех, кто видит без глаз (слепое зрение) или видит истину (истинное зрение), и на тех, кто тебя не видит вовсе.</p>`},
 cloud_of_daggers:{n:'Облако кинжалов',lv:2,fight:1,conc:1,where:'18 м',short:'вихрь клинков, 4к4 каждому внутри',roll:{n:4,s:4,up:2,ns:1,t:'рубящего урона: тому, кто входит в облако впервые за ход или начинает там ход. Спасброска нет'},fx:'steel',meta:'2 круг · 1 действие · 18 м · концентрация до 1 минуты · В, С, М (осколок стекла)',
  d:()=>`<p>В кубе со стороной <b>1,5 м</b> в точке до 18 м закручиваются призрачные кинжалы.</p><p>Существо, которое <b>входит в облако впервые за ход</b> или <b>начинает в нём ход</b>, получает <b>4к4 рубящего урона</b>. Спасброска нет.</p><p class="mu">Ячейкой 3 круга и выше: +2к4 за каждый круг выше второго.</p>`},
 crown_of_madness:{n:'Корона безумия',lv:2,fight:1,conc:1,where:'36 м',short:'гуманоид бьёт того, кого укажешь',meta:'2 круг · 1 действие · 36 м · концентрация до 1 минуты · В, С',
  d:()=>`<p>Гуманоид, которого видишь в пределах 36 м, делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>. При провале он <b>очарован</b>: над головой у него появляется корона из зазубренного железа, в глазах безумие.</p><p>В каждый свой ход, <b>прежде чем двигаться</b>, он должен действием атаковать вплотную существо, которое ты мысленно укажешь (не себя). Если никого не укажешь или рядом никого нет, ходит как обычно.</p><p>Каждый свой ход ты должен тратить <b>действие</b>, чтобы удерживать его, иначе заклинание кончается. В конце каждого своего хода цель повторяет спасбросок и при успехе освобождается.</p>`},
 darkness:{n:'Тьма',lv:2,fight:1,conc:1,where:'18 м',short:'сфера магической тьмы 4,5 м',meta:'2 круг · 1 действие · 18 м · концентрация до 10 минут · В, М (мех летучей мыши и капля смолы или уголёк)',
  d:()=>`<p>Из точки в пределах 18 м расползается <b>магическая тьма</b>: сфера радиусом <b>4,5 м</b>, огибает углы. Сквозь неё <b>не видит даже тёмное зрение</b>, а обычный свет её не освещает.</p><p>Если наложить тьму на предмет, который ты держишь или который никто не носит, она движется вместе с ним. Накрой предмет чем-то непрозрачным (миской, шлемом), и тьма скрыта.</p><p class="mu">Если тьма задевает свет от заклинания 2 круга и ниже, тот свет гаснет.</p>`},
 darkvision:{n:'Тёмное зрение',lv:2,where:'касание',short:'видеть в темноте 18 м, 8 часов',meta:'2 круг · 1 действие · касание · 8 часов · В, С, М (сушёная морковь или агат)',
  d:()=>`<p>Ты касаешься согласного существа. На <b>8 часов</b> оно получает <b>тёмное зрение на 18 м</b>: в темноте видит как в сумраке, только оттенки серого.</p><p class="mu">Концентрации не нужно. Можно наложить и на себя.</p>`},
 detect_thoughts:{n:'Обнаружение мыслей',lv:2,soc:1,conc:1,where:'на себя',short:'читать мысли того, кто рядом',meta:'2 круг · 1 действие · на себя · концентрация до 1 минуты · В, С, М (медная монетка)',
  d:()=>`<p>Ты можешь читать мысли существ рядом. Действием выбери одно в пределах <b>9 м</b>, которое видишь: узнаёшь, <b>о чём оно сейчас думает</b>. Существа с Интеллектом 3 и ниже и те, кто не знает ни одного языка, не годятся.</p><p>В следующие ходы действием можно перейти к другому существу или <b>копнуть глубже</b>. Тогда цель делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>. При провале ты понимаешь, как оно рассуждает, что чувствует и что для него сейчас важнее всего (чего боится, что любит, что ненавидит). При успехе заклинание кончается.</p><p>Когда копаешь глубже, цель <b>понимает это</b>. Если ты не переключишься, она может действием сделать проверку Интеллекта против твоей. Выиграла: заклинание кончается.</p><p>Ещё ты можешь действием почувствовать присутствие разумных существ в 9 м, которых не видишь. Мешают 60 см камня, 5 см металла, тонкий свинец или 90 см дерева.</p><p class="mu">Хорошо работает на допросе: вопросы сами направляют мысли собеседника.</p>`},
 enhance_ability:{n:'Улучшение характеристики',lv:2,soc:1,conc:1,where:'касание',short:'преимущество на одну характеристику',meta:'2 круг · 1 действие · касание · концентрация до 1 часа · В, С, М (шерсть или перо зверя)',
  d:()=>`<p>Ты касаешься существа и даёшь ему на час одно усиление:</p><p>• <b>Выносливость медведя</b>: преимущество на проверки Телосложения и <b>2к6 временных хитов</b> (пропадают, когда заклинание кончится).<br>• <b>Сила быка</b>: преимущество на проверки Силы, переносимый вес вдвое.<br>• <b>Грация кошки</b>: преимущество на проверки Ловкости, не получает урона от падения с 6 м и ниже, если не недееспособно.<br>• <b>Великолепие орла</b>: преимущество на проверки <b>Харизмы</b>.<br>• <b>Хитрость лиса</b>: преимущество на проверки Интеллекта.<br>• <b>Мудрость совы</b>: преимущество на проверки Мудрости.</p><p class="mu">Ячейкой 3 круга и выше: +1 цель за каждый круг выше второго.</p>`},
 enlarge_reduce:{n:'Увеличение/уменьшение',lv:2,fight:1,conc:1,where:'9 м',short:'цель вдвое больше или меньше',meta:'2 круг · 1 действие · 9 м · концентрация до 1 минуты · В, С, М (щепотка толчёного железа)',
  d:()=>`<p>Существо или предмет в пределах 9 м, которые видишь, <b>растут или уменьшаются</b> на минуту. Несогласное существо делает <b>спасбросок Телосложения против Сл ${spellDC()}</b>, при успехе ничего не происходит.</p><p><b>Увеличение</b>: вдвое больше во всех измерениях, в 8 раз тяжелее, на один размер крупнее. <b>Преимущество</b> на проверки и спасброски Силы. Оружие растёт вместе с ним: <b>+1к4</b> к урону.</p><p><b>Уменьшение</b>: вдвое меньше, в 8 раз легче, на один размер мельче (не меньше крошечного). <b>Помеха</b> на проверки и спасброски Силы. Урон оружия <b>−1к4</b> (не меньше 1).</p><p class="mu">Если места не хватает, цель вырастает, сколько может.</p>`},
 gust_of_wind:{n:'Порыв ветра',lv:2,fight:1,conc:1,where:'линия 18 м',short:'ветер отталкивает на 4,5 м',meta:'2 круг · 1 действие · на себя, линия 18 м × 3 м · концентрация до 1 минуты · В, С, М (бобовое семечко)',
  d:()=>`<p>От тебя бьёт сильный ветер: линия <b>18 м</b> длиной и <b>3 м</b> шириной.</p><p>Каждое существо, которое <b>начинает ход</b> в этой линии, делает <b>спасбросок Силы против Сл ${spellDC()}</b>. При провале его <b>отталкивает на 4,5 м</b> от тебя вдоль линии.</p><p>Идти против ветра тяжело: каждый метр к тебе стоит 2 м скорости.</p><p>Ветер разгоняет газ и туман, гасит свечи, факелы и открытый огонь. Огонь в фонаре колышется и гаснет с шансом 50%.</p><p class="mu">В следующие ходы бонусным действием можешь развернуть линию в другую сторону.</p>`},
 invisibility:{n:'Невидимость',lv:2,soc:1,fight:1,conc:1,where:'касание',short:'невидим, пока не атакуешь',meta:'2 круг · 1 действие · касание · концентрация до 1 часа · В, С, М (ресница в смоле)',
  d:()=>`<p>Существо, которого ты касаешься, становится <b>невидимым</b> на час вместе со всем, что на нём надето и что оно несёт.</p><p>Заклинание кончается для цели, как только она <b>атакует или творит заклинание</b>.</p><p class="mu">Невидимого всё ещё можно услышать и найти по следам. Ячейкой 3 круга и выше: +1 цель за каждый круг выше второго.</p>`},
 knock:{n:'Открывание',lv:2,where:'18 м',short:'открыть замок, громкий стук',meta:'2 круг · 1 действие · 18 м · мгновенно · В',
  d:()=>`<p>Выбери предмет в пределах 18 м: дверь, сундук, кандалы, навесной замок, что-то запертое. Один замок, засов или задвижка <b>открывается</b>, застрявшее отходит. Если замков несколько, открывается один.</p><p>Магический замок (Волшебный замок) не снимается, а <b>отключается на 10 минут</b>.</p><p>Раздаётся <b>громкий стук</b>, его слышно за 90 м.</p>`},
 levitate:{n:'Левитация',lv:2,fight:1,conc:1,where:'18 м',short:'поднять существо в воздух на 6 м',meta:'2 круг · 1 действие · 18 м · концентрация до 10 минут · В, С, М (кожаная петелька или изогнутая золотая проволочка)',
  d:()=>`<p>Существо или незакреплённый предмет весом до <b>225 кг</b> в пределах 18 м <b>поднимается в воздух</b> на высоту до 6 м и висит там. Несогласное существо делает <b>спасбросок Телосложения против Сл ${spellDC()}</b>.</p><p>Цель может двигаться, только отталкиваясь от стен и опор, как будто лезет. В свой ход ты можешь поднять или опустить её до 6 м. Если цель ты сам, двигаешься вверх и вниз своим перемещением.</p><p>Когда заклинание кончается, цель плавно опускается на землю.</p>`},
 mirror_image:{n:'Отражения',lv:2,fight:1,where:'на себя',short:'три копии принимают удары',meta:'2 круг · 1 действие · на себя · 1 минута · В, С',
  d:()=>`<p>Вокруг тебя появляются <b>три иллюзорные копии</b>. Они двигаются с тобой и повторяют каждое движение, так что не понять, где настоящий.</p><p>Когда тебя атакуют, брось <b>к20</b>, не попадёт ли удар в копию. Три копии: в копию на <b>6+</b>. Две: на <b>8+</b>. Одна: на <b>11+</b>.</p><p>У копии КД <b>${10+mod(S.ab.dex)}</b> (10 + Ловкость). Попадание её уничтожает. Копии гибнут только от попаданий атакой. Когда исчезнут все три, заклинание кончается.</p><p class="mu">Концентрации не нужно. Не действует на тех, кто тебя не видит, видит без глаз или видит истину.</p>`,
  rolls:[{l:'к20: удар в копию?',s:20,t:'три копии: в копию на 6+ · две: на 8+ · одна: на 11+'}]},
 phantasmal_force:{n:'Воображаемая сила',lv:2,fight:1,soc:1,conc:1,where:'18 м',short:'иллюзия в голове у одной цели',meta:'2 круг · 1 действие · 18 м · концентрация до 1 минуты · В, С, М (клочок шерсти)',
  d:()=>`<p>Ты лепишь иллюзию <b>прямо в разуме</b> одного существа в пределах 18 м. Оно делает <b>спасбросок Интеллекта против Сл ${spellDC()}</b>. При провале видит предмет, существо или явление, какое придумаешь, размером не больше куба <b>3 м</b>. Видит его только цель.</p><p>Цель считает иллюзию настоящей и объясняет себе всё странное («верёвка порвалась», «мост был гнилой»). Она может действием изучить иллюзию: проверка Интеллекта (Анализ) против <b>Сл ${spellDC()}</b>. Поняла, что это обман, и заклинание для неё кончилось.</p><p>Если иллюзия может ранить (огонь, обрушенный пол, чудовище), цель получает <b>1к6 психического урона</b> каждый твой ход, пока стоит в ней или рядом с иллюзорным существом (1,5 м). Цель сама верит, что это огонь или когти.</p>`,
  rolls:[{l:'Воображаемая сила: урон',n:1,s:6,t:'психической энергией, раз в твой ход'}]},
 scorching_ray:{n:'Палящий луч',lv:2,fight:1,atk:1,hit:()=>'3 луча по 2к6',rays:c=>3+Math.max(0,(c||2)-2),dmg:c=>({dn:2,ds:6,t:'огнём',fx:'fire'}),where:'36 м',short:'3 огненных луча, каждый 2к6',meta:'2 круг · 1 действие · 36 м · мгновенно · В, С',
  d:()=>`<p>Ты выпускаешь <b>три огненных луча</b> в одну или несколько целей в пределах 36 м.</p><p>Каждый луч это <b>отдельная дальнобойная атака заклинанием: к20 ${sg(spellAtk())}</b>. При попадании <b>2к6 урона огнём</b>.</p><p class="mu">Ячейкой 3 круга и выше: +1 луч за каждый круг выше второго.</p><div class="how">В приложении: после каждого луча внизу кнопка «Следующий луч». Лучи бросаются по одному.</div>`},
 see_invisibility:{n:'Видение невидимого',lv:2,where:'на себя',short:'видеть невидимое и эфир, 1 час',meta:'2 круг · 1 действие · на себя · 1 час · В, С, М (тальк и серебряная пыль)',
  d:()=>`<p>На час ты <b>видишь невидимых существ и предметы</b> так, будто они видимы.</p><p>Ещё ты заглядываешь на <b>Эфирный план</b>: всё, что там, выглядит призрачным и полупрозрачным.</p><p class="mu">Концентрации не нужно.</p>`},
 shatter:{n:'Дребезги',lv:2,fight:1,where:'18 м',short:'звон 3к8, спасбросок Телосложения',roll:{n:3,s:8,up:1,t:'звуком, спасбросок Телосложения (камень, металл и кристалл с помехой)',half:1},fx:'snd',meta:'2 круг · 1 действие · 18 м · сфера радиусом 3 м · В, С, М (осколок слюды)',
  d:()=>`<p>Из точки в пределах 18 м бьёт <b>оглушительный звон</b>. Каждое существо в сфере радиусом <b>3 м</b> делает <b>спасбросок Телосложения против Сл ${spellDC()}</b>: при провале <b>3к8 урона звуком</b>, при успехе половина.</p><p>Существа из камня, кристалла или металла делают спасбросок <b>с помехой</b>. Предметы в сфере, которые никто не держит, тоже получают урон.</p><p class="mu">Ячейкой 3 круга и выше: +1к8 за каждый круг выше второго.</p>`},
 spider_climb:{n:'Паук',lv:2,conc:1,where:'касание',short:'ходить по стенам и потолку',meta:'2 круг · 1 действие · касание · концентрация до 1 часа · В, С, М (капля битума и паук)',
  d:()=>`<p>Согласное существо, которого ты касаешься, на час может <b>ходить по стенам и потолку</b>, вниз головой, и руки остаются свободными.</p><p>Его скорость лазания равна обычной скорости.</p>`},
 web:{n:'Паутина',lv:2,fight:1,conc:1,where:'18 м',short:'липкая паутина, опутывает',meta:'2 круг · 1 действие · 18 м · куб 6 м · концентрация до 1 часа · В, С, М (кусочек паутины)',
  d:()=>`<p>Ты заполняешь куб со стороной <b>6 м</b> в пределах 18 м густой липкой паутиной. Это <b>труднопроходимая местность</b> и лёгкое укрытие от взгляда.</p><p>Паутина должна держаться за две опоры (стены, деревья) или лечь слоем на пол, стену или потолок (тогда слой 1,5 м). Если опор нет, она рушится в начале твоего следующего хода.</p><p>Существо, которое <b>начинает ход</b> в паутине или <b>входит</b> в неё, делает <b>спасбросок Ловкости против Сл ${spellDC()}</b>. При провале оно <b>опутано</b>, пока не выберется. Выбраться: действие, проверка Силы против <b>Сл ${spellDC()}</b>.</p><p>Паутина горит: куб 1,5 м сгорает за раунд, а тот, кто начинает ход в огне, получает <b>2к4 урона огнём</b>.</p>`},
 counterspell:{n:'Контрзаклинание',lv:3,fight:1,react:1,where:'18 м',short:'сорвать чужое заклинание, реакция',meta:'3 круг · реакция · 18 м · мгновенно · С',
  d:()=>`<p>Реакция: когда ты видишь, как существо в пределах 18 м <b>творит заклинание</b>.</p><p>Заклинание <b>3 круга и ниже</b> срывается без броска. Если круг выше, сделай проверку <b>Харизмы ${sg(mod(S.ab.cha))}</b> против Сл 10 + круг того заклинания. При успехе оно тоже срывается.</p><p><b>Ячейкой выше 3 круга</b>: без броска срываются заклинания до круга этой ячейки.</p>`},
 fireball:{n:'Огненный шар',lv:3,fight:1,where:'45 м',short:'спасбросок Ловкости, 8к6 огнём',roll:{n:8,s:6,up:1,t:'огнём, спасбросок Ловкости'},meta:'3 круг · 1 действие · 45 м · сфера радиусом 6 м · В, С, М (сера и гуано)',
  d:()=>`<p>Яркая искра летит в точку до 45 м и взрывается сферой <b>радиусом 6 м</b>, огонь огибает углы. Каждый в сфере делает <b>спасбросок Ловкости против Сл ${spellDC()}</b>: при провале <b>8к6 урона огнём</b>, при успехе половина.</p><p>Горючие предметы, которые никто не держит, загораются.</p><p><b>Ячейкой выше 3 круга</b>: +1к6 за каждый круг выше.</p>`},
 hypnotic_pattern:{n:'Гипнотический узор',lv:3,fight:1,conc:1,where:'36 м',short:'видящие узор замирают',meta:'3 круг · 1 действие · 36 м · куб 9 м · концентрация до 1 минуты · С, М (светящаяся палочка)',
  d:()=>`<p>В кубе со стороной 9 м в пределах 36 м вспыхивает переливчатый узор. Каждый, кто его видит, делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>.</p><p>При провале существо <b>очаровано</b>: оно <b>недееспособно</b> и его скорость 0. Оно приходит в себя, если получит урон или кто-то действием его встряхнёт.</p><p class="mu">Слепых и тех, кого нельзя очаровать, узор не берёт.</p>`},
 greater_invisibility:{n:'Высшая невидимость',lv:4,fight:1,conc:1,where:'касание',short:'невидим, даже когда атакуешь',meta:'4 круг · 1 действие · касание · концентрация до 1 минуты · В, С',
  d:()=>`<p>Ты или существо, которого ты касаешься, становится <b>невидимым</b> на минуту. Всё, что цель несёт, тоже невидимо.</p><p>В отличие от обычной невидимости, она <b>не спадает</b>, когда цель атакует или творит заклинания. Атаки невидимого с преимуществом, по нему с помехой.</p>`},
 dominate_person:{n:'Подчинение личности',lv:5,soc:1,fight:1,conc:1,where:'18 м',short:'гуманоид слушается твоих приказов',meta:'5 круг · 1 действие · 18 м · концентрация до 1 минуты · В, С',
  d:()=>`<p>Гуманоид в пределах 18 м делает <b>спасбросок Мудрости против Сл ${spellDC()}</b>, с преимуществом, если вы с ним сражаетесь. При провале он <b>очарован</b> тобой.</p><p>Между вами телепатическая связь: ты отдаёшь приказы без действия, и он старается их выполнить. Действием можно управлять им полностью, тогда он делает только то, что ты скажешь.</p><p>Каждый раз, получив урон, цель снова делает спасбросок и при успехе освобождается.</p><p><b>Ячейкой 6 круга</b> до 10 минут, 7 круга до 1 часа, 8 круга и выше до 8 часов.</p>`},
 comprehend_languages:{n:'Понимание языков',lv:1,soc:1,short:'понимаешь любую речь и текст',meta:'1 круг · 1 действие · на себя · 1 час · ритуал · В, С, М (сажа и соль)',
  d:()=>`<p>На 1 час ты понимаешь <b>буквальный смысл любой речи</b> на любом языке. Можешь читать любой текст, касаясь его, примерно минута на страницу.</p><p>Тайные шифры и магические знаки не расшифровывает.</p><p class="mu">Ритуал: можно сотворить за 10 минут без ячейки.</p>`}
};
/* все заклинания чародея для 0–1 круга (PHB 2014), своими словами. dmg(c) = урон атаки, roll = урон без атаки (спасбросок / автопопадание / запас хитов) */
Object.assign(SPELLS,{
 acid_splash:{n:'Брызги кислоты',lv:0,fight:1,where:'18 м',short:'спасбросок Ловкости, кислота',roll:{n:()=>cantN(),s:6,t:'кислотой, спасбросок Ловкости',half:0},fx:'acid',meta:'заговор · 1 действие · 18 м · мгновенно · В, С',
  d:()=>`<p>Ты бросаешь шар кислоты в <b>одно существо</b> в пределах 18 м или в <b>двух</b>, если они стоят не дальше 1,5 м друг от друга.</p><p>Каждая цель делает <b>спасбросок Ловкости против Сл ${spellDC()}</b>. При провале <b>${cantN()}к6 урона кислотой</b>, при успехе ничего.</p><p class="mu">Броска атаки нет: работает даже против тех, кого трудно задеть.</p>`},
 blade_ward:{n:'Защита от оружия',lv:0,fight:1,where:'на себя',short:'вполовину урон от оружия',meta:'заговор · 1 действие · на себя · 1 раунд · В, С',
  d:()=>`<p>До конца твоего следующего хода у тебя <b>сопротивление</b> дробящему, колющему и рубящему урону <b>от атак оружием</b>: такой урон уменьшается вдвое.</p><p class="mu">Против когтей, зубов и заклинаний не помогает, только против оружия.</p>`},
 chill_touch:{n:'Леденящее прикосновение',lv:0,fight:1,atk:1,tw:1,hit:()=>cantN()+'к8 некротической энергией',dmg:()=>({dn:cantN(),ds:8,t:'некротической энергией',fx:'snd'}),where:'36 м',short:'атака, цель не лечится',meta:'заговор · 1 действие · 36 м · 1 раунд · В, С',
  d:()=>`<p>Призрачная рука скелета хватает существо в пределах 36 м. Это <b>дальнобойная атака заклинанием: к20 ${sg(spellAtk())}</b>.</p><p>При попадании <b>${cantN()}к8 урона некротической энергией</b>, и до начала твоего следующего хода цель <b>не может восстанавливать хиты</b>.</p><p>Если цель <b>нежить</b>, до конца твоего следующего хода у неё ещё и <b>помеха на атаки по тебе</b>.</p>`},
 dancing_lights:{n:'Пляшущие огоньки',lv:0,soc:1,conc:1,short:'до 4 огоньков, летят куда скажешь',meta:'заговор · 1 действие · 36 м · концентрация до 1 минуты · В, С, М (фосфор, гнилушка или светлячок)',
  d:()=>`<p>В пределах 36 м появляются <b>до четырёх огоньков</b> размером с факел (или одна светящаяся фигура человеческого роста). Каждый даёт тусклый свет на 3 м.</p><p><b>Бонусным действием</b> двигаешь их до 18 м. Они держатся не дальше 6 м друг от друга и гаснут, если улетят дальше 36 м от тебя.</p>`},
 light:{n:'Свет',lv:0,soc:1,short:'предмет светит как факел, 1 час',meta:'заговор · 1 действие · касание · 1 час · В, М (светлячок или светящийся мох)',
  d:()=>`<p>Предмет, которого ты касаешься (не больше 3 м), <b>светится 1 час</b>: яркий свет на 6 м и тусклый ещё на 6 м. Цвет любой.</p><p>Если предмет накрыть чем-то непрозрачным, свет не проходит. Закончится, если сотворишь снова или погасишь действием.</p><p class="mu">Если предмет держит враг, он делает спасбросок Ловкости против Сл ${spellDC()}, чтобы увернуться.</p>`},
 mending:{n:'Починка',lv:0,soc:1,short:'чинит одну поломку до 30 см',meta:'заговор · 1 минута · касание · мгновенно · В, С, М (два магнитных камня)',
  d:()=>`<p>За минуту ты <b>чинишь одну поломку</b> не больше 30 см у предмета, которого касаешься: порванное звено цепи, сломанный ключ, дырку в плаще, течь в бурдюке. Следа не остаётся.</p><p class="mu">Волшебный предмет можно склеить, но вернуть ему магию нельзя.</p>`},
 poison_spray:{n:'Ядовитые брызги',lv:0,fight:1,tw:1,where:'3 м',short:'спасбросок Телосложения, яд',roll:{n:()=>cantN(),s:12,t:'ядом, спасбросок Телосложения',half:0},fx:'poi',meta:'заговор · 1 действие · 3 м · мгновенно · В, С',

 shocking_grasp:{n:'Электрошок',lv:0,fight:1,atk:1,tw:1,hit:()=>cantN()+'к8 электричеством',dmg:()=>({dn:cantN(),ds:8,t:'электричеством, у цели нет реакций',fx:'elec'}),where:'касание',short:'атака касанием, без реакций',meta:'заговор · 1 действие · касание · мгновенно · В, С',

 true_strike:{n:'Меткий удар',lv:0,fight:1,conc:1,where:'9 м',short:'преимущество на следующую атаку',meta:'заговор · 1 действие · 9 м · концентрация до 1 раунда · С',

 burning_hands:{n:'Огненные ладони',lv:1,fight:1,where:'конус 4,5 м',short:'конус огня, 3к6, спасбросок Ловкости',roll:{n:3,s:6,up:1,t:'огнём, спасбросок Ловкости',half:1},fx:'fire',meta:'1 круг · 1 действие · на себя, конус 4,5 м · мгновенно · В, С',

 color_spray:{n:'Сверкающие брызги',lv:1,fight:1,where:'конус 4,5 м',short:'ослепляет слабых в конусе',roll:{n:6,s:10,up:2,pool:1,t:'это запас хитов: ослепляет существ'},fx:'snd',meta:'1 круг · 1 действие · на себя, конус 4,5 м · 1 раунд · В, С, М (щепотка красного, жёлтого и синего порошка)',

 expeditious_retreat:{n:'Поспешное отступление',lv:1,fight:1,conc:1,nq:1,where:'на себя',short:'Рывок бонусным действием',meta:'1 круг · бонусное действие · на себя · концентрация до 10 минут · В, С',

 fog_cloud:{n:'Туманное облако',lv:1,fight:1,conc:1,where:'36 м',short:'туман радиусом 6 м',meta:'1 круг · 1 действие · 36 м · концентрация до 1 часа · В, С',

 mage_armor:{n:'Доспехи мага',lv:1,fight:1,where:'касание',short:'класс доспеха 13 + Ловкость, 8 часов',meta:'1 круг · 1 действие · касание · 8 часов · В, С, М (кусочек выделанной кожи)',

 magic_missile:{n:'Волшебная стрела',lv:1,fight:1,where:'36 м',short:'3 стрелы, всегда попадают',roll:{n:3,s:4,up:1,per:1,t:'силовым полем, стрелы попадают всегда'},fx:'snd',meta:'1 круг · 1 действие · 36 м · мгновенно · В, С',

 ray_of_sickness:{n:'Луч болезни',lv:1,fight:1,atk:1,tw:1,hit:()=>'2к8 ядом',dmg:c=>({dn:2+Math.max(0,(c||1)-1),ds:8,t:`ядом, и спасбросок Телосложения против ${spellDC()}: при провале отравлен`,fx:'poi'}),where:'18 м',short:'атака 2к8 ядом и отравление',meta:'1 круг · 1 действие · 18 м · мгновенно · В',

 silent_image:{n:'Безмолвный образ',lv:1,soc:1,conc:1,short:'беззвучная иллюзия до 4,5 м',meta:'1 круг · 1 действие · 18 м · концентрация до 10 минут · В, С, М (овечья шерсть)',

 sleep:{n:'Усыпление',lv:1,soc:1,fight:1,where:'27 м',short:'усыпляет слабых, 5к8 хитов',roll:{n:5,s:8,up:2,pool:1,t:'это запас хитов: усыпляет существ'},fx:'snd',meta:'1 круг · 1 действие · 27 м · 1 минута · В, С, М (щепотка песка, лепестки роз или сверчок)',
  d:()=>`<p>Бросок <b>5к8</b> показывает, сколько хитов существ ты можешь усыпить в сфере радиусом 6 м вокруг точки в пределах 27 м.</p><p>Начиная с существа с <b>наименьшими текущими хитами</b>, каждое <b>засыпает на 1 минуту</b> (без сознания), а его хиты вычитаются из запаса. Следующее засыпает, только если его хитов не больше остатка. Спасброска нет.</p><p>Спящий просыпается от урона или если кто-то действием его растолкает.</p><p class="mu">Не действует на нежить и тех, кого нельзя очаровать. Очень сильно на низких уровнях. Ячейкой 2 круга и выше: +2к8.</p>`},
 thunderwave:{n:'Волна грома',lv:1,fight:1,where:'куб 4,5 м',short:'2к8 звуком и отбросить на 3 м',roll:{n:2,s:8,up:1,t:'звуком, спасбросок Телосложения; при провале ещё и отброшен на 3 м',half:1},fx:'snd',meta:'1 круг · 1 действие · на себя, куб 4,5 м · мгновенно · В, С',
  d:()=>`<p>От тебя расходится волна силы: <b>куб 4,5 м</b> рядом с тобой.</p><p>Каждый в нём делает <b>спасбросок Телосложения против Сл ${spellDC()}</b>. При провале <b>2к8 урона звуком</b> и его <b>отбрасывает на 3 м</b> от тебя. При успехе половина урона и он стоит на месте.</p><p class="mu">Грохот слышно за 90 м. Ячейкой 2 круга и выше: +1к8 за каждый круг выше первого.</p>`},
 witch_bolt:{n:'Ведьмин снаряд',lv:1,fight:1,atk:1,conc:1,tw:1,hit:()=>'1к12 электричеством',dmg:c=>({dn:c||1,ds:12,t:'электричеством. Дальше каждый ход действием 1к12 без броска',fx:'elec'}),where:'9 м',short:'дуга молнии, бьёт каждый ход',meta:'1 круг · 1 действие · 9 м · концентрация до 1 минуты · В, С, М (ветка из дерева, в которое била молния)',
  d:()=>`<p>Дуга молнии тянется к существу в пределах 9 м. Это <b>дальнобойная атака заклинанием: к20 ${sg(spellAtk())}</b>. При попадании <b>1к12 урона электричеством</b>.</p><p>Пока держишь концентрацию, в каждый свой ход можешь <b>действием</b> нанести цели ещё <b>1к12 автоматически</b>, без броска.</p><p class="mu">Кончается, если ты потратишь действие на другое, цель уйдёт дальше 9 м или за полное укрытие. Ячейкой 2 круга и выше: первый удар +1к12 за каждый круг выше первого.</p>`}

/* компоненты с ценой (по книге, решение мастера 2026-11-27): нужен сам предмет в инвентаре. Покупается один раз. Тратится, только если в заклинании сказано «расходуется» (cost.cons) */
SPELLS.chromatic_orb.cost={gp:50,what:'бриллиант',key:'diamond'};
SPELLS.chromatic_orb.d=()=>`<p>Ты бросаешь сферу энергии в существо в пределах 27 м. Выбери вид урона: <b>звук, кислота, огонь, холод, электричество или яд</b>.</p><p>Это <b>дальнобойная атака заклинанием: к20 ${sg(spellAtk())}</b>. При попадании <b>3к8 урона</b> выбранного вида.</p><p class="mu">Ячейкой 2 круга и выше: +1к8 за каждый круг выше первого.</p>`;
SPELLS.chromatic_orb.dmg=c=>({dn:3+Math.max(0,(c||1)-1),ds:8,t:ORBDMG[S.orbT],fx:ELK[S.orbT]});
SPELLS.fire_bolt.dmg=()=>({dn:cantN(),ds:10,t:'огнём',fx:'fire'});
const MV={pp:1000,gp:100,sp:10,cp:1},MN={pp:'пм',gp:'зм',sp:'см',cp:'мм'};
const purse=()=>Object.keys(MV).reduce((a,k)=>a+(S.money[k]||0)*MV[k],0);
const costCp=p=>p&&p.cost?p.cost.gp*100:0;
const compKey=p=>{if(!p||!p.cost)return null;const c=p.cost;if(S.items[c.key]&&S.items[c.key].q>0)return c.key;
 return Object.keys(S.items).find(k=>S.items[k].q>0&&isComp(k)&&(ITEMS[k]?ITEMS[k].n:S.items[k].n||'').toLowerCase().includes(c.what.slice(0,6)))||null};
const canPay=p=>!p||!p.cost||!!compKey(p);
/* состояния, при которых нет действий и реакций: ни колдовать, ни атаковать */
const NOACT=['unconscious','paralyzed','petrified','stunned','incapacitated'];
const noAct=()=>{const k=NOACT.find(c=>S.cond&&S.cond[c]);return k?COND[k].n:null};
const noActBtn=()=>`<button class="ghost" data-go="tab:p-char">Сними состояние «${noAct()}» на вкладке «Персонаж» ›</button><button class="ghost" data-info="c_${NOACT.find(c=>S.cond[c])}">Что это за состояние ›</button>`;
/* «что сделать, чтобы стало можно»: вместо причины нажимаемая подсказка-действие */
const needB=(t,g)=>`<button class="need" data-go="${g}"><span>${t}</span><i>›</i></button>`;
const needS=(t,g)=>`<span class="need" data-go="${g}">${t} ›</span>`;
const todoBox=a=>a.length?`<div class="how todo"><b class="wt">Что сделать, чтобы стало можно</b>${a.join('')}</div>`:'';
function goTo(g){const i=g.indexOf(':'),t=i<0?g:g.slice(0,i),v=i<0?'':g.slice(i+1);
 if(t==='lv'){closeDrawer();setTimeout(lvOpen,260)}
 else if(t==='tab'){closeDrawer();const b=document.querySelector('.tabs button[data-p="'+v+'"]');if(b)b.click()}
 else if(t==='info')openInfo(v);
 else if(t==='flash'){document.querySelectorAll('#dbody .dacts button').forEach(b=>b.animate([{boxShadow:'0 0 0 0 rgba(240,196,122,.95)'},{boxShadow:'0 0 0 9px rgba(240,196,122,0)'}],{duration:800,iterations:2}))}}
window.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-go]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();goTo(b.dataset.go)},true);
/* почему заклинание тусклое: объяснение сверху в его шторке (не всплывашкой) */
function offWhy(k){const p=SPELLS[k],w=[];
 if(noAct())w.push(needB(`Сними состояние «${noAct()}»: оно отмечено на вкладке «Персонаж»`,'tab:p-char'));
 if(p.lv&&!firstC(p.lv)&&!(k==='shield'&&S.shieldOn)&&!(p.conc&&S.conc===k)&&!(k==='mage_armor'&&S.mArm)){w.push(needB(`Нужна свободная ячейка${p.lv>1?' '+p.lv+' круга или выше':''}: они вернутся после долгого отдыха`,'info:long'));if(S.spt.max-S.spt.used>=2)w.push(needB(`Или создай ячейку из единиц чародейства: перетащи единицы на круг в «Запасах» вкладки «Бой»`,'tab:p-fight'))}
 if(!canPay(p)){w.push(needB(`Положи в инвентарь ${p.cost.what}: купи его за ${p.cost.gp} золотых или отметь, что он у тебя уже есть`,'flash'));if(purse()<costCp(p))w.push(needB(`Не хватает золота: добавь монет в кошелёк`,'info:coin_gp'))}
 if(metaArm&&!metaOk(metaArm,k,p.lv))w.push(`<div class="mu" style="margin-top:6px">Сними метамагию «${META[metaArm].n}»: сюда она не подходит (${MWHY[metaArm]}).</div>`);

 if(S.chaos.used>0){S.chaos.used=0;x+='<div class="br">Поток хаоса снова готов.</div>'}
 save();setTimeout(renderAll,50);
 return `<div class="br">строка ${String(lo).padStart(2,'0')}–${hi===100?'00':String(hi).padStart(2,'0')}</div><div class="surge">${SURGE[i]}</div>${x}${S.level>=14&&!two?`<div class="br" style="color:var(--gold2)">Контролируемый хаос: бросай к100 ещё раз и выбери любой из двух эффектов</div><div class="acts"><button data-surge2>Второй бросок к100</button></div>`:two?'<div class="br" style="color:var(--gold2)">Выбери этот эффект или прошлый</div>':''}`}})}

 else{if(die===1)D.f+=2;else if(die>=10)D.s++;else D.f++;
  if(D.s>=3){S.death={s:0,f:0};msg='Три успеха: Филипп стабилен. Без сознания, но не умирает'}
  else if(D.f>=3){D.f=3;msg='Три провала. Мастер скажет, что дальше'}}
 save();renderAll();if(msg){toast(msg);vib(die===20?[20,40,80]:[40,60,40])}}


/* ---------- ПРЕДМЕТЫ НА ЭКРАНАХ «Общение» и «Бой» ----------
   Инвентарь подключается так: кладёт описание предмета в ITEMS[ключ] и ключ в S.inv (что у Филиппа есть).
   ITEMS[ключ] = {n:'Название', short:'коротко, что даёт', soc:1 — полезен в разговоре, fight:1 — в бою,
                  meta:'строка под заголовком', d:()=>'<p>точное описание механики</p>', acts:()=>'<button data-act="...">…</button>'}
   Что показано на экране, выбирает игрок галочками: S.sItemShow (Общение), S.fItemShow (Бой), до 4 штук. */
const ITEMS={};
const ITMAX=4;
function itemList(kind){const fl=kind==='soc'?'soc':'fight';return (S.inv||[]).filter(k=>ITEMS[k]&&ITEMS[k][fl])}
function renderItems(kind){const el=$(kind==='soc'?'sItems':'fItems');if(!el)return;const show=kind==='soc'?S.sItemShow:S.fItemShow,all=itemList(kind),list=all.filter(k=>show.includes(k));
 el.innerHTML=list.length?list.map(k=>`<button class="it" data-info="it_${k}"><b>${ITEMS[k].n}</b><small>${ITEMS[k].short||''}</small></button>`).join(''):`<button class="it empty" data-info="itempick_${kind}">${all.length?'выбери, какие предметы держать под рукой ›':kind==='soc'?'здесь будут предметы для разговора из инвентаря':'здесь будут предметы для боя из инвентаря'}</button>`}
function renderSRes(){const el=$('sres');if(!el)return;
 el.innerHTML=`<button class="fc heart" data-info="heart"><span class="t">Сердце тьмы<small>простые люди помогают</small></span><span class="eye">◉</span></button>
 <button class="fc ${chaosArmed?'armed':''}" data-info="chaos"><div class="t">Поток хаоса<small>${chaosArmed?'готов!':'преимущество'}</small></div><div class="ch">${Array.from({length:S.chaos.max},(_,i)=>`<span class="charge v ${i<S.chaos.used?'used':''}"></span>`).join('')}</div></button>`;
 renderItems('soc')}

   S.items[ключ] = {q сколько, soc, fight где пригодится, used потрачено зарядов, on настроен, а у своих предметов ещё n, short, txt}.
   Порядок в S.inv. ITEMS (для блоков в «Общении» и «Бою») собирается из справочника ICAT и S.items в syncItems(). */
let invFilter='all',delArm=null;

function syncItems(){S.inv=Object.keys(S.items);
