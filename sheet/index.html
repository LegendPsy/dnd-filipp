 slots:()=>({t:'Ячейки 1 круга',sub:`осталось ${slotsLeft()} из ${slotsTot()}`,body:`<p>Ячейка это «заряд» для заклинания 1 круга: Щит, Цветной шарик, Очарование личности. Сотворил, и одна ячейка погасла.</p><p><b>Заговоры</b> (Огненный снаряд, Дружба и другие) ячеек не тратят, их можно творить без конца.</p><p>Ячейки возвращает <b>долгий отдых</b>. В бою ячейку можно создать из 2 единиц чародейства (Гибкое колдовство).</p>${S.slots.extra?`<p class="mu">Из них созданных из единиц: ${S.slots.extra}. Они пропадут после долгого отдыха.</p>`:''}`,
  acts:`<button data-info="flex">Гибкое колдовство ›</button><button class="ghost" data-act="slotBack" ${S.slots.used?'':'disabled'}>Вернуть одну ячейку (ошибся)</button>`}),
 flex:()=>({t:'Гибкое колдовство',sub:`единицы чародейства: ${S.spt.max-S.spt.used} из ${S.spt.max}`,body:`<p>Чародей носит в себе запас сырой магии: <b>единицы чародейства</b>. Их ${S.spt.max}, возвращаются после долгого отдыха.</p><p><b>Бонусным действием</b> в свой ход можно:</p><p>• потратить <b>2 единицы</b> и создать <b>ячейку 1 круга</b>. Созданная ячейка исчезает после долгого отдыха;<br>• погасить <b>ячейку 1 круга</b> и получить <b>1 единицу</b>.</p><p class="mu">С 3 уровня единицы ещё понадобятся для метамагии: менять заклинания на лету.</p>`,
  acts:`<button data-act="pt2slot" ${S.spt.max-S.spt.used>=2?'':'disabled'}>2 единицы → ячейка 1 круга</button><button class="ghost" data-act="slot2pt" ${slotsLeft()&&S.spt.used?'':'disabled'}>Ячейка → 1 единица</button>`}),
 surge:()=>({t:'Волна дикой магии',sub:'дикая магия чародея',body:`<p>Магия Филиппа плохо слушается. <b>Сразу после заклинания 1 круга и выше</b> мастер может сказать бросить к20. На <b>1</b> случается волна: бросаешь к100 по таблице, и происходит что-то странное. От огненного шара вокруг себя до бороды из перьев.</p><p>Если <b>Поток хаоса</b> уже потрачен, мастер может сразу сказать бросить по таблице, без к20. После этого Поток хаоса возвращается.</p><div class="how">В таблице 50 строк, лист прочтёт нужную. Вернуть ячейку или единицы лист сделает сам.</div>`,
  acts:`<button data-act="surgeD20">Мастер попросил: бросить к20</button><button class="ghost" data-act="surgeD100">Сразу к100 по таблице</button>`}),
 conc:()=>{const c=mod(S.ab.con)+(S.saves.con?prof():0);return{t:'Концентрация',sub:S.conc?`держишь: ${SPELLS[S.conc].n}`:'сейчас ничего',body:`<p>Некоторые заклинания действуют, пока ты <b>держишь их вниманием</b>. Держать можно только одно: новое такое заклинание обрывает старое.</p><p>Когда тебя <b>ранят</b>, делаешь спасбросок Телосложения <b>${sg(c)}</b>. Сложность <b>10</b> или половина урона, если она больше. Провал: заклинание обрывается.</p><p>Также обрывается, если ты без сознания или погиб.</p>`,
  acts:`<button data-act="concSave">Меня ранили: спасбросок ${sg(c)}</button>${S.conc?`<button class="ghost" data-act="concEnd">Закончить ${SPELLS[S.conc].n}</button>`:''}`}},
 death:()=>({t:'Спасброски от смерти',sub:`успехи ${S.death.s} из 3 · провалы ${S.death.f} из 3`,body:`<p>Когда хиты падают до <b>0</b>, Филипп без сознания. В начале каждого своего хода бросаешь <b>к20 без бонусов</b>:</p><p>• <b>10 и больше</b>: успех. Три успеха: ты стабилен, больше не бросаешь.<br>• <b>9 и меньше</b>: провал. Три провала: смерть.<br>• <b>1</b>: два провала сразу.<br>• <b>20</b>: ты приходишь в себя с 1 хитом.</p><p>Урон при 0 хитах: один провал, от крита два. Любое лечение сразу поднимает на ноги.</p>`,
  acts:`<button data-act="deathRoll">Бросить спасбросок от смерти</button><button class="ghost" data-act="deathHit">Меня ударили на 0 хитах: +1 провал</button><button class="ghost" data-act="deathReset" ${S.death.s||S.death.f?'':'disabled'}>Сбросить: стабилен или вылечен</button>`}),
 luck:()=>({t:'Везунчик',sub:'черта · 3 очка удачи',body:`<p>У тебя <b>3 очка удачи</b>. Осталось: <b>${S.luck.max-S.luck.used}</b>.</p>
  <p>Когда ты бросаешь к20 на <b>атаку, проверку или спасбросок</b>, можешь потратить одно очко и бросить <b>ещё один к20</b>. Потом сам выбираешь, какой из двух кубиков засчитать. Решать можно уже увидев первый кубик, но до того, как мастер скажет итог.</p>
  <p>Ещё очко можно потратить, когда <b>враг атакует тебя</b>: бросаешь свой к20 и выбираешь, какой кубик возьмёт враг, его или твой.</p>
  <div class="how">В приложении: после любого броска к20 внизу появится кнопка «Везунчик». Очки возвращаются после долгого отдыха.</div>`,
  acts:`<button data-act="luckSpend" ${S.luck.used>=S.luck.max?'disabled':''}>Потратить очко вручную (атака врага)</button><button class="ghost" data-act="luckBack" ${S.luck.used?'':'disabled'}>Вернуть одно очко</button>`}),
 chaos:()=>({t:'Поток хаоса',sub:'дикая магия · 1 раз',body:`<p>Один раз можешь получить <b>преимущество</b> на один бросок <b>атаки, проверки или спасброска</b>. Преимущество значит: бросаешь два к20 и берёшь больший.</p>
  <p>После этого умение потрачено. Оно вернётся после <b>долгого отдыха</b>. Или раньше: если ты сотворишь заклинание чародея 1 уровня или выше, мастер может сказать бросить по таблице <b>волны дикой магии</b>, и тогда Поток хаоса восстанавливается.</p>
  <div class="how">В приложении: нажми «Включить», и следующий бросок сам пойдёт с преимуществом. Состояние: <b>${chaosArmed?'включено, ждёт броска':S.chaos.used>=S.chaos.max?'потрачено':'готово'}</b>.</div>`,
  acts:chaosArmed?`<button class="ghost" data-act="chaosOff">Выключить, передумал</button>`:S.chaos.used>=S.chaos.max?`<button data-act="chaosBack">Вернуть: была волна дикой магии</button>`:`<button data-act="chaosOn">Включить на следующий бросок</button>`}),
 hd:()=>{const c=mod(S.ab.con),left=S.level-S.hd.used;return{t:'Кости хитов',sub:`к${S.hd.die} · ${left} из ${S.level}`,body:`<p>Это твой запас лечения на <b>короткий отдых</b> (час покоя: перевязать раны, перекусить). У тебя по одной кости <b>к${S.hd.die}</b> на каждый уровень, сейчас <b>${left} из ${S.level}</b>.</p>
  <p>На коротком отдыхе можно потратить одну или несколько. Каждая лечит <b>к${S.hd.die} ${sg(c)}</b> (Телосложение) хитов, минимум 1.</p>
  <p>После <b>долгого отдыха</b> возвращается половина от всех костей, минимум одна.</p>
  <div class="how">Хиты сейчас: <b>${S.hp.cur} из ${S.hp.max}</b>.</div>`,
  acts:`<button data-act="hdRoll" ${left?'':'disabled'}>Бросить кость и вылечиться</button>`}},
 insp:()=>({t:'Вдохновение',sub:'награда от мастера',body:`<p>Мастер даёт вдохновение за хорошую игру: например, когда ты отыграл характер Филиппа, его страхи или привязанности. Можно иметь <b>только одно</b>.</p>
  <p>Потратив его, получаешь <b>преимущество</b> на один бросок <b>атаки, проверки или спасброска</b>. Можно и отдать другому игроку.</p>
  <div class="how">Сейчас: <b>${inspArmed?'потрачено на следующий бросок':S.insp?'есть':'нет'}</b>.</div>`,
  acts:S.insp?(inspArmed?`<button class="ghost" data-act="inspOff">Не тратить, передумал</button>`:`<button data-act="inspUse">Потратить: следующий бросок с преимуществом</button><button class="ghost" data-act="inspGive">Отдал другому игроку</button>`):`<button data-act="inspGet">Мастер дал вдохновение</button>`}),
 short:()=>({t:'Короткий отдых',sub:'около часа',body:`<p>Час покоя: перевязать раны, поесть, отдышаться. Во время короткого отдыха можно тратить <b>кости хитов</b>, чтобы лечиться.</p>
  <p>Везунчик, Поток хаоса и ячейки заклинаний короткий отдых <b>не возвращает</b>.</p>`,acts:`<button data-act="toHd">Открыть кости хитов</button>`+(S.level>=20?`<button data-act="sorcRest" ${S.spt.used?'':'disabled'}>Восстановление чародейства: вернуть 4 единицы</button>`:'')}),
 long:()=>({t:'Долгий отдых',sub:'8 часов, раз в сутки',body:`<p>Не меньше <b>8 часов</b>: сон и спокойные дела. Не чаще раза в сутки. Если отдых прервал бой больше чем на час, его надо начать заново.</p>
  <p>После него возвращается:</p><p>• все <b>хиты</b><br>• половина <b>костей хитов</b> (минимум 1)<br>• все очки <b>Везунчика</b><br>• <b>Поток хаоса</b><br>• снимается 1 уровень <b>истощения</b>, если ты поел и попил<br>• все ячейки заклинаний и единицы чародейства</p>`,acts:`<button data-act="longRest">Отдохнуть до утра</button>`}),
 smagpick:()=>({t:'Заклинания на экране',sub:`галочка = показать в «Общении» · ${S.smagShow.length} из 8`,body:`<button class="bookbtn" data-info="book">Книга заклинаний: какие Филипп знает ›</button>`+known().filter(k=>SPELLS[k]&&SPELLS[k].soc).map(k=>{const sh=S.smagShow.includes(k),p=SPELLS[k];return `<button class="crow ck ${sh?'on':''}" data-sshow="${k}"><span><i class="box">${sh?'✓':''}</i>${rn(p)}${p.n}</span><small>${p.lv?'':'заговор'}</small></button>`}).join('')+`<div class="how" style="margin-top:10px">Здесь только заклинания Филиппа, которые помогают в разговоре: очарование, иллюзии, послания. Боевые (Огненный снаряд, Щит, Цветной шарик) сюда не попадают. Отметь до 8.</div>`,acts:`<button data-act="closeD">Готово</button>`}),
 spelldc:()=>({t:'Сложность заклинаний',sub:`${spellDC()} = 8 + мастерство ${prof()} + Харизма ${sg(mod(S.ab.cha))}`,body:`<p>Когда твоё заклинание действует на кого-то (Очарование личности, иллюзия), цель делает <b>спасбросок</b>. Если выбросит <b>${spellDC()} или больше</b>, заклинание её не берёт.</p><p>Чем выше число, тем труднее устоять.</p><div class="how">Бросать ничего не нужно: число называешь мастеру, бросает он.</div>`,acts:''}),
 fair:()=>{const d=S.d20s||Array(20).fill(0),n=d.reduce((a,b)=>a+b,0),sim=window.__sim;
  const bars=(arr)=>{const mx=Math.max(1,...arr);return `<div class="hist">${arr.map((v,i)=>`<i class="${i===19?'t':''}" style="height:${(v/mx*100).toFixed(1)}%"></i>`).join('')}</div><div class="hlab">${arr.map((_,i)=>`<span>${i+1}</span>`).join('')}</div>`};
  return{t:'Честность кубика',sub:'как лист бросает к20',body:`<p>Кубик в листе берёт числа из <b>криптографического генератора</b> телефона (crypto.getRandomValues). Это стандарт браузеров, на нём держатся пароли и шифрование. Каждая грань выпадает с шансом ровно <b>1 из 20 (5%)</b>, перекоса нет.</p>
  <p><b>Твои броски к20:</b> ${n?`${n} шт., двадцаток ${d[19]} (${(d[19]/n*100).toFixed(1)}%)`:'пока нет'}</p>${n?bars(d):''}
  ${sim?`<p style="margin-top:12px"><b>Проверка: 10 000 бросков.</b> Двадцаток ${sim[19]} (${(sim[19]/100).toFixed(1)}%). Любая грань: от ${Math.min(...sim)} до ${Math.max(...sim)} раз, в среднем 500.</p>${bars(sim)}`:''}
  <div class="how">На малом числе бросков бывают серии, это нормально: настоящий кубик тоже может выдать три двадцатки подряд. Чем больше бросков, тем ровнее столбики. Нажми проверку и покажи игрокам: все грани около 500 из 10 000.</div>`,
  acts:`<button data-act="fairSim">Бросить 10 000 раз</button>`}},
 conds:()=>({t:'Состояния',sub:'галочка = значок на экране',body:CORDER.map(k=>{const sh=S.condShow.includes(k);return `<button class="crow ck ${sh?'on':''}" data-cshow="${k}"><span><i class="box">${sh?'✓':''}</i>${k==='exh'?'Истощение':COND[k].n}</span><small>${cndOn(k)?(k==='exh'?'уровень '+S.exh:'на мне'):''}</small></button>`}).join('')+`<div class="how" style="margin-top:10px">На экране нажатие на значок сразу включает или выключает состояние. Истощение: каждое нажатие +1 уровень, после 6 снова 0. Помехи и скорость лист считает сам.</div>`,acts:`<button data-act="closeD">Готово</button>`}),
 exh:()=>({t:'Истощение',sub:`уровень ${S.exh} из 6`,body:`<p>Уровни складываются: на 3 уровне действуют и 1, и 2.</p>`+EXH.slice(1).map((t,i)=>`<p${S.exh>=i+1?' class="warn"':''}>${S.exh>=i+1?'●':'○'} <b>${i+1}</b>: ${t}</p>`).join('')+`<div class="how">Долгий отдых, если ты поел и попил, снимает 1 уровень. Лист снимет его сам при долгом отдыхе.</div>`,acts:`<button data-act="exhUp" ${S.exh>=6?'disabled':''}>Добавить уровень</button><button class="ghost" data-act="exhDown" ${S.exh?'':'disabled'}>Снять уровень</button>`}),
 heart:()=>({t:'Сердце тьмы',sub:'умение предыстории «Преследуемый»',body:`<p>Кто посмотрит тебе в глаза, видит: ты встречался с невообразимым ужасом и тьма тебе не чужда.</p><p>Простые люди могут тебя побаиваться, но будут <b>вежливы</b> и сделают всё, чтобы <b>помочь</b>: подскажут дорогу, накормят, спрячут.</p><p>Если ты не угрожал им и остался один против врага, они даже могут <b>взяться за оружие и драться рядом с тобой</b>.</p><div class="how">Бросать ничего не нужно. Это работает в разговоре: напомни мастеру, что у тебя есть это умение, когда просишь помощи у крестьян, трактирщиков, стражи.</div>`,acts:''}),
 lang:()=>({t:'Языки',sub:'говоришь, читаешь и пишешь',body:LANGS.map(([n,ex,d])=>`<p><b>${n==='Инферн.'?'Инфернальный':n}</b>${ex?' <span class="mu">· редкий</span>':''}<br>${d}</p>`).join('')+`<div class="how">Бросать ничего не нужно: на этих языках ты просто понимаешь речь и тексты. Происхождение: Общий от рождения, Инфернальный от расы, Бездны и Драконий от предыстории.</div>`,acts:''}),
 senses:()=>({t:'Чутьё',sub:'пассивные проверки',body:`<p>Это то, что Филипп замечает <b>без броска</b>. Число = 10 + модификатор + мастерство, если владеешь навыком.</p>
  <p><b>Пассивное восприятие ${pas('perception')}</b>: заметить спрятавшегося врага, засаду, ловушку. Если Скрытность врага ниже, ты его видишь.</p>
  <p><b>Пассивная проницательность ${pas('insight')}</b>: почувствовать, что собеседник врёт или что-то скрывает.</p>
  <p><b>Пассивный анализ ${pas('investigation')}</b>: заметить нестыковку, скрытую дверь, след, если ты что-то осматриваешь.</p>
  <div class="how">Эти числа нужны мастеру, нажимать их не надо. Если хочешь искать активно, открой Мудрость или Интеллект и бросай навык.</div>`,acts:''})
};
['traits','ideal','bond','flaw'].forEach(k=>INFO['ch_'+k]=()=>({t:CHAR[k].t,sub:'характер Филиппа',body:CHAR[k].full+`<div class="how">Это подсказка для отыгрыша, бросать ничего не нужно. Если ты сыграл Филиппа по этой черте, особенно когда ему это мешает, мастер может дать <b>вдохновение</b>.</div>`,acts:S.insp?'':`<button data-act="inspGet">Мастер дал вдохновение</button>`}));
Object.keys(COND).forEach(k=>INFO['c_'+k]=()=>{const on=S.cond[k];return{t:COND[k].n,sub:on?'сейчас на тебе':'состояние',body:COND[k].d+`<div class="how">${COND[k].fx.chk||COND[k].fx.atk||COND[k].fx.svdex||COND[k].fx.spd0||COND[k].fx.fail?'Если отметишь, лист сам учтёт это в бросках и скорости.':'Это работает в сцене, мастер следит за этим. Отметь, чтобы не забыть.'}</div>`,acts:on?`<button class="ghost" data-act="condOff:${k}">Снять: больше не ${COND[k].n.toLowerCase()}</button>`:`<button data-act="condOn:${k}">На мне</button>`}});

/* книга заклинаний: какие заклинания Филипп знает. Галочка = выучить/забыть, название = описание */
function bkCount(){const kn=known().filter(k=>SPELLS[k]);return{c:kn.filter(k=>!SPELLS[k].lv).length,s:kn.filter(k=>SPELLS[k].lv).length,C:cantKnown(S.level),Sx:spKnown(S.level)}}
INFO.book=()=>{const kn=known(),n=bkCount(),mc=maxCircle(S.level);
 const row=k=>{const p=SPELLS[k],on=kn.includes(k),full=p.lv?n.s>=n.Sx:n.c>=n.C;return `<div class="brow ${on?'on':''} ${full&&!on?'bkoff':''}" data-row="${k}"><button class="bx" data-learn="${k}" aria-label="${on?'забыть':'выучить'}"><i class="box">${on?'✓':''}</i></button><button class="bn" data-info="bk_${k}"><b>${rn(p)}${p.n}</b><small>${p.short}</small></button>${costTag(p)}</div>`};
 const grp=lv=>Object.keys(SPELLS).filter(k=>SPELLS[k].lv===lv).sort((a,b)=>SPELLS[a].n.localeCompare(SPELLS[b].n,'ru'));
 let body=`<div class="bkh"><span>Заговоры</span><em class="${n.c>=n.C?'full':''}" data-cnt="c">${n.c} из ${n.C}</em></div>`+grp(0).map(row).join('');
 for(let c=1;c<=mc;c++){const g=grp(c);if(g.length)body+=`<div class="bkh"><span>${ROM[c]} круг</span>${c===1?`<em class="${n.s>=n.Sx?'full':''}" data-cnt="s">заклинаний ${n.s} из ${n.Sx}${mc>1?' (всех кругов)':''}</em>`:''}</div>`+g.map(row).join('')}
 body+=`<div class="how" style="margin-top:10px">Галочка: Филипп знает это заклинание. Нажми на название, чтобы прочитать, что оно делает.<br><span class="gpc">${coinSvg(['#f3cf7a','#a8761e'])}50 зм</span> заклинанию нужен дорогой компонент: его надо купить один раз и держать в инвентаре.<br>Когда всё набрано, сними галочку с одного, чтобы взять другое. По правилам чародей меняет одно известное заклинание при новом уровне, перебор больше этого согласуй с мастером.${mc>1?'<br>Заклинаний 2 круга и выше в листе пока не все.':''}</div>`;

 fire_bolt:{u:'204-fire-bolt',h:'Заговор, воплощение',m:[['Время накладывания','1 действие'],['Дистанция','120 футов (36 м)'],['Компоненты','В, С'],['Длительность','Мгновенная']],
  t:`<p>Ты бросаешь сгусток огня в существо или предмет в пределах дистанции. Соверши по цели дальнобойную атаку заклинанием. При попадании цель получает урон огнём 1к10. Горючие предметы, по которым попал снаряд, воспламеняются, если их никто не несёт и не носит.</p><p>Урон этого заклинания увеличивается на 1к10, когда ты достигаешь 5 уровня (2к10), 11 уровня (3к10) и 17 уровня (4к10).</p>`},
 friends:{u:'71-friends',h:'Заговор, очарование',m:[['Время накладывания','1 действие'],['Дистанция','на себя'],['Компоненты','С, М (немного грима, наносимого на лицо при накладывании)'],['Длительность','Концентрация, вплоть до 1 минуты']],
  t:`<p>На время действия заклинания ты совершаешь с преимуществом все проверки Харизмы, направленные на одно выбранное тобой существо, не враждебное к тебе.</p><p>Когда заклинание оканчивается, существо понимает, что ты использовал магию для влияния на его настроение, и становится враждебным к тебе. Существо, склонное к насилию, может напасть на тебя. Другое существо может искать возмездия другими способами (на усмотрение Мастера), в зависимости от того, как ты с ним взаимодействовал.</p>`},
 minor_illusion:{u:'154-minor-illusion',h:'Заговор, иллюзия',m:[['Время накладывания','1 действие'],['Дистанция','30 футов (9 м)'],['Компоненты','С, М (кусочек овечьей шерсти)'],['Длительность','1 минута']],
  t:`<p>Ты создаёшь в пределах дистанции звук или образ предмета, который существует, пока длится заклинание. Иллюзия оканчивается, если ты отпустишь её действием или сотворишь это заклинание ещё раз.</p><p>Если ты создаёшь <b>звук</b>, его громкость может быть от шёпота до крика. Это может быть твой голос, чей-то другой голос, львиный рык, бой барабанов или любой другой звук. Звук может звучать всю длительность заклинания, или ты можешь создавать отдельные звуки в разное время, пока заклинание действует.</p><p>Если ты создаёшь <b>образ предмета</b> (например, стул, грязные следы или небольшой сундук), он должен помещаться в куб с длиной ребра 5 футов (1,5 м). Образ не может издавать звуки, свет, запах и прочие сенсорные эффекты. Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит.</p><p>Если существо действием исследует звук или образ, оно может понять, что это иллюзия, преуспев в проверке Интеллекта (Анализ) против Сл твоих заклинаний. Если существо распознаёт иллюзию, она становится для него нечёткой.</p>`},
 message:{u:'331-message',h:'Заговор, преобразование',m:[['Время накладывания','1 действие'],['Дистанция','120 футов (36 м)'],['Компоненты','В, С, М (короткий кусок медной проволоки)'],['Длительность','1 раунд']],
  t:`<p>Ты указываешь пальцем на существо в пределах дистанции и шёпотом произносишь послание. Цель (и только цель) слышит его и может ответить шёпотом, который услышишь только ты.</p><p>Ты можешь использовать это заклинание сквозь твёрдые предметы, если хорошо знаком с целью и знаешь, что она за преградой. Магическая тишина, 1 фут (30 см) камня, 1 дюйм (2,5 см) обычного металла, тонкий лист свинца или 3 фута (90 см) дерева блокируют заклинание. Заклинанию не нужно идти по прямой линии: оно может огибать углы и проходить через отверстия.</p>`},

  t:`<p>Ты пытаешься очаровать гуманоида, которого видишь в пределах дистанции. Он должен совершить спасбросок Мудрости, и совершает его с преимуществом, если ты или твои компаньоны сражаетесь с ним. При провале он очарован тобой, пока заклинание не окончится или пока ты или твои компаньоны не причините ему вред. Очарованное существо считает тебя дружелюбно настроенным знакомым. Когда заклинание оканчивается, существо знает, что было очаровано тобой.</p><p><b>На больших уровнях.</b> Если ты накладываешь это заклинание, используя ячейку 2 круга или выше, ты можешь сделать целью одно дополнительное существо за каждый круг ячейки выше первого. Существа должны находиться в пределах 30 футов (9 м) друг от друга.</p>`},

  t:`<p>Появляется невидимый барьер из магической силы, защищающий тебя. До начала своего следующего хода ты получаешь бонус +5 к КД, в том числе и против вызвавшей срабатывание атаки, и не получаешь урон от волшебной стрелы.</p>`},

  t:`<p>Ты бросаешь сферу энергии диаметром 4 дюйма (10 см) в существо, которое видишь в пределах дистанции. Выбери звук, кислоту, огонь, холод, электричество или яд как вид создаваемой сферы, а потом соверши по цели дальнобойную атаку заклинанием. Если атака попадает, существо получает 3к8 урона выбранного вида.</p><p><b>На больших уровнях.</b> Если ты накладываешь это заклинание, используя ячейку 2 круга или выше, урон увеличивается на 1к8 за каждый круг ячейки выше первого.</p>`},

  t:`<p>Ты изменяешь свою внешность, включая одежду, доспехи, оружие и прочие вещи, что есть у тебя, пока заклинание не окончится или ты не окончишь его действием. Ты можешь казаться на 1 фут (30 см) ниже или выше, худым, толстым или средним. Ты не можешь изменить тип тела, так что должен принять облик с тем же расположением конечностей. Прочие детали иллюзии на твоё усмотрение.</p><p>Изменения, сделанные заклинанием, не выдерживают физической проверки. Например, если ты добавил к своему наряду шляпу, предметы будут проходить сквозь неё, а тот, кто её коснётся, ничего не почувствует или нащупает твою голову и волосы. Если ты выглядишь худее, чем есть, рука того, кто к тебе тянется, наткнётся на тебя, пока ещё будет в воздухе.</p><p>Чтобы распознать, что ты замаскирован, существо может действием изучить твою внешность. Оно должно преуспеть в проверке Интеллекта (Анализ) против Сл твоих заклинаний.</p>`},
 comprehend_languages:{u:'252-comprehend-languages',h:'1 круг, прорицание (ритуал)',m:[['Время накладывания','1 действие'],['Дистанция','на себя'],['Компоненты','В, С, М (щепотка сажи и соли)'],['Длительность','1 час']],
  t:`<p>На время действия заклинания ты понимаешь буквальное значение любого слышимого языка. Ты также понимаешь любой видимый письменный язык, но должен при этом касаться поверхности, на которой написаны слова. Чтение одной страницы текста занимает примерно 1 минуту.</p><p>Это заклинание не расшифровывает тайные послания в тексте и символы, такие как магические знаки, которые не являются частью письменного языка.</p>`}

INFO.cf_cast=()=>({t:'Колдовство',sub:'чародей · 1 уровень',body:`<p>Магия у тебя в крови, и ты колдуешь через <b>Харизму</b>.</p><p><b>Сложность спасброска</b> от твоих заклинаний: <b>${spellDC()}</b> (8 + мастерство ${prof()} + Харизма ${sg(mod(S.ab.cha))}).<br><b>Атака заклинанием</b>: <b>${sg(spellAtk())}</b> (мастерство + Харизма).</p><p>Заговоров ты знаешь <b>${cantKnown(S.level)}</b>, заклинаний 1 круга и выше <b>${spKnown(S.level)}</b>. Ячейки тратятся на заклинания и возвращаются после долгого отдыха.</p><p class="mu">С каждым новым уровнем можно заменить одно известное заклинание другим. Заговоры не меняются.</p>`,acts:`<button data-info="book">Книга заклинаний ›</button>`});
INFO.cf_asi=()=>({t:'Улучшение характеристик',sub:'4, 8, 12, 16 и 19 уровни',body:`<p>На этих уровнях выбираешь одно:</p><p>• <b>+2 к характеристикам</b>: +2 к одной или +1 к двум. Выше 20 поднять нельзя.<br>• <b>Черта</b>: особое умение вместо прибавки.</p><p class="mu">Если вырастет Телосложение, максимум хитов растёт задним числом: +1 за каждый уровень на каждый +1 модификатора.</p>`});
INFO.cf_cchaos=()=>({t:'Контролируемый хаос',sub:'дикая магия · 14 уровень',body:`<p>Когда бросаешь к100 по таблице волны дикой магии, бросаешь <b>дважды</b> и выбираешь, какой из двух эффектов случится.</p><div class="how">В приложении: под результатом волны появится кнопка «Второй бросок к100».</div>`});
INFO.cf_bomb=()=>({t:'Бомбардировка заклинаниями',sub:'дикая магия · 18 уровень',body:`<p>Когда бросаешь урон заклинания и на каком-то кубике выпал <b>максимум</b>, можешь бросить ещё один такой кубик и прибавить к урону. <b>Раз в ход.</b></p><div class="how">В приложении: если на кубике урона выпал максимум, под итогом появится кнопка «Бросить ещё».</div>`});
INFO.cf_rest=()=>({t:'Восстановление чародейства',sub:'чародей · 20 уровень',body:`<p>Когда заканчиваешь <b>короткий отдых</b>, возвращаешь <b>4 единицы чародейства</b>.</p>`,acts:`<button data-act="sorcRest" ${S.spt.used?'':'disabled'}>Короткий отдых закончен: +4 единицы</button>`});

/* ---- черты PHB 2014. pre() → '' если можно, иначе причина. ab: какую характеристику +1 (одна = сразу, несколько = выбрать) ---- */
const AB13=(a,n)=>()=>S.ab[a]>=13?'':`нужно ${n} 13 и выше`;
const FEATS={
 actor:{n:'Артистичный',ab:['cha'],s:'+1 Харизма, подражаешь голосам и людям',d:'<p><b>+1 к Харизме.</b></p><p>Преимущество на проверки Обмана и Выступления, когда выдаёшь себя за другого человека.</p><p>Подражаешь речи человека или звукам существа, которые слышал хотя бы минуту. Чтобы раскусить подделку, слушателю нужна проверка Проницательности против твоего Обмана.</p>'},
 alert:{n:'Бдительный',s:'+5 к инициативе, тебя не застать врасплох',d:'<p><b>+5 к инициативе.</b></p><p>Пока ты в сознании, тебя нельзя застать врасплох.</p><p>Существа, которых ты не видишь, не получают из-за этого преимущества на атаки по тебе.</p>',fx:'инициатива +5 считается в листе сама'},
 athlete:{n:'Атлетичный',ab:['str','dex'],s:'+1 Сила или Ловкость, легче лазать и прыгать',d:'<p><b>+1 к Силе или Ловкости.</b></p><p>Подняться из положения лёжа стоит всего 1,5 м перемещения.</p><p>Лазание не тратит лишнего перемещения.</p><p>Прыжок с разбега выходит после разбега всего в 1,5 м.</p>'},
 charger:{n:'Налётчик',s:'после Рывка удар или толчок с разгона',d:'<p>Когда совершаешь Рывок, можешь бонусным действием сделать одну рукопашную атаку оружием или толкнуть существо.</p><p>Если перед этим пробежал по прямой хотя бы 3 м: <b>+5 к урону</b> атаки или толкаешь цель на 3 м.</p>'},
 crossbow_expert:{n:'Эксперт в арбалетах',s:'арбалеты без перезарядки, стрельба вплотную',d:'<p>Перезарядка арбалета не мешает стрелять несколько раз.</p><p>Стоя вплотную к врагу (1,5 м), стреляешь без помехи.</p><p>Когда атакуешь одноручным оружием, можешь бонусным действием выстрелить из ручного арбалета.</p>'},
 defensive_duelist:{n:'Оборонительный дуэлянт',pre:AB13('dex','Ловкость'),s:'кинжалом парируешь удар: +мастерство к КД',d:'<p>Если у тебя в руке <b>фехтовальное оружие</b>, которым ты владеешь (например, кинжал), и по тебе попадает рукопашная атака, можешь <b>реакцией</b> прибавить мастерство к КД против этой атаки. Может превратить попадание в промах.</p>'},
 dual_wielder:{n:'Использование двух оружий',s:'+1 к КД с оружием в каждой руке',d:'<p><b>+1 к КД</b>, пока держишь по рукопашному оружию в каждой руке.</p><p>Можешь сражаться двумя оружиями, даже если они не лёгкие.</p><p>Достаёшь или убираешь два одноручных оружия за раз.</p>'},
 dungeon_delver:{n:'Исследователь подземелий',s:'чуешь ловушки и потайные двери',d:'<p>Преимущество на Восприятие и Анализ, чтобы найти <b>потайные двери</b>.</p><p>Преимущество на спасброски от <b>ловушек</b>, сопротивление их урону.</p><p>Ищешь ловушки на обычной скорости, а не медленно.</p>'},
 durable:{n:'Стойкий',ab:['con'],s:'+1 Телосложение, кости хитов лечат больше',d:'<p><b>+1 к Телосложению.</b></p><p>Когда тратишь кость хитов, восстанавливаешь минимум вдвое больше модификатора Телосложения (не меньше 2).</p>',fx:'минимум для костей хитов лист считает сам'},
 elemental_adept:{n:'Стихийный адепт',rep:1,opt:'el',s:'одна стихия пробивает сопротивление',d:'<p>Выбери стихию: <b>кислота, холод, огонь, электричество или звук</b>.</p><p>Твои заклинания этой стихии <b>игнорируют сопротивление</b> к ней.</p><p>Когда бросаешь урон этой стихии, единицы на кубиках считаются <b>двойками</b>.</p><p class="mu">Можно брать несколько раз, каждый раз другую стихию.</p>'},
 grappler:{n:'Борец',pre:AB13('str','Сила'),s:'держишь и прижимаешь схваченных',d:'<p>Преимущество на атаки по существу, которое ты держишь в захвате.</p><p>Действием можешь прижать схваченное: ещё одна проверка захвата. Успех: вы оба опутаны, пока захват не кончится.</p>'},
 great_weapon_master:{n:'Мастер большого оружия',s:'тяжёлым оружием −5 к атаке, +10 к урону',d:'<p>Когда критом или добиванием рукопашным оружием роняешь врага до 0, можешь бонусным действием ударить ещё раз.</p><p>Перед атакой тяжёлым оружием, которым владеешь, можешь взять −5 к атаке, чтобы получить +10 к урону.</p>'},
 healer:{n:'Лекарь',s:'набор целителя лечит 1к6 + 4 и больше',d:'<p>Когда стабилизируешь умирающего набором целителя, он ещё и получает <b>1 хит</b>.</p><p>Действием и одним использованием набора лечишь существо на <b>1к6 + 4 + число его костей хитов</b>. Каждое существо так лечится раз между отдыхами.</p>'},
 heavily_armored:{n:'Знаток тяжёлых доспехов',ab:['str'],pre:()=>hasFeat('moderately_armored')?'':'нужно владеть средними доспехами',s:'+1 Сила, тяжёлые доспехи',d:'<p><b>+1 к Силе.</b></p><p>Владеешь <b>тяжёлыми доспехами</b>.</p>'},
 heavy_armor_master:{n:'Мастер тяжёлых доспехов',ab:['str'],pre:()=>hasFeat('heavily_armored')?'':'нужно владеть тяжёлыми доспехами',s:'+1 Сила, в латах урон оружием −3',d:'<p><b>+1 к Силе.</b></p><p>В тяжёлом доспехе дробящий, колющий и рубящий урон от немагического оружия по тебе <b>уменьшается на 3</b>.</p>'},
 inspiring_leader:{n:'Воодушевляющий лидер',pre:AB13('cha','Харизма'),s:'речь даёт друзьям временные хиты',d:()=>`<p>10 минут вдохновляешь до шести союзников (и себя) в пределах 9 м, которые тебя слышат и понимают.</p><p>Каждый получает <b>временные хиты</b>: твой уровень + Харизма (сейчас <b>${S.level+mod(S.ab.cha)}</b>). Каждое существо получает их раз между отдыхами.</p>`},
 keen_mind:{n:'Отличная память',ab:['int'],s:'+1 Интеллект, помнишь всё за месяц',d:'<p><b>+1 к Интеллекту.</b></p><p>Всегда знаешь, где север, и сколько часов до восхода или заката.</p><p>Точно помнишь всё, что видел или слышал за последний месяц.</p>'},
 lightly_armored:{n:'Знаток лёгких доспехов',ab:['str','dex'],s:'+1 Сила или Ловкость, лёгкие доспехи',d:'<p><b>+1 к Силе или Ловкости.</b></p><p>Владеешь <b>лёгкими доспехами</b>: кожаный, стёганый, проклёпанный. В проклёпанной коже КД 12 + Ловкость.</p><p class="mu">Чародеи без владения доспехами не могут колдовать в доспехах.</p>'},
 linguist:{n:'Языковед',ab:['int'],s:'+1 Интеллект, три новых языка, шифры',d:'<p><b>+1 к Интеллекту.</b></p><p>Учишь <b>три языка</b> на выбор (договорись с мастером).</p><p>Придумываешь шифры. Чтобы разгадать, нужна магия или проверка Интеллекта против твоего Интеллекта + мастерство.</p>'},
 lucky:{n:'Везунчик',s:'3 очка удачи: перебросить к20',d:'<p>3 очка удачи в день: перебросить свою атаку, проверку или спасбросок, или чужую атаку по тебе.</p>'},
 mage_slayer:{n:'Убийца магов',s:'бьёшь колдующих рядом с тобой',d:'<p>Когда существо в 1,5 м от тебя творит заклинание, можешь реакцией ударить его оружием.</p><p>Если ранишь того, кто держит концентрацию, его спасбросок с помехой.</p><p>Преимущество на спасброски от заклинаний тех, кто в 1,5 м от тебя.</p>'},
 magic_initiate:{n:'Посвящённый в магию',s:'2 заговора и 1 заклинание другого класса',d:'<p>Выбери класс: бард, волшебник, друид, жрец, колдун или чародей.</p><p>Учишь <b>2 заговора</b> и <b>1 заклинание 1 круга</b> из его списка. Это заклинание раз в день творишь без ячейки.</p><p class="mu">Выбор согласуй с мастером: в книге листа пока только заклинания чародея.</p>'},
 martial_adept:{n:'Воинский адепт',s:'два приёма мастера боевых искусств',d:'<p>Учишь <b>два приёма</b> мастера боевых искусств (подсечка, финт, обезоруживание и другие) и получаешь кость превосходства <b>к6</b>. Она возвращается после любого отдыха.</p>'},
 medium_armor_master:{n:'Мастер средних доспехов',pre:()=>hasFeat('moderately_armored')?'':'нужно владеть средними доспехами',s:'тише и крепче в средних доспехах',d:'<p>Средние доспехи не дают помехи на Скрытность.</p><p>В среднем доспехе прибавляешь к КД Ловкость до +3, а не до +2.</p>'},
 mobile:{n:'Подвижный',s:'+3 м скорости, уходишь без Удара вслед',d:'<p><b>Скорость +3 м.</b></p><p>Во время Рывка труднопроходимая местность не замедляет.</p><p>Если атаковал существо вплотную, оно не может сделать по тебе Удар вслед до конца хода, попал ты или нет.</p>',fx:'скорость +3 м прибавится сама'},
 moderately_armored:{n:'Знаток средних доспехов',ab:['str','dex'],pre:()=>hasFeat('lightly_armored')?'':'нужно владеть лёгкими доспехами',s:'+1 Сила или Ловкость, средние доспехи и щит',d:'<p><b>+1 к Силе или Ловкости.</b></p><p>Владеешь <b>средними доспехами и щитами</b>.</p>'},
 mounted_combatant:{n:'Верховой боец',s:'сражаешься верхом',d:'<p>Преимущество на рукопашные атаки по пешим существам меньше твоего скакуна.</p><p>Можешь перевести на себя атаку по скакуну.</p><p>Скакун при спасброске Ловкости на половину урона не получает урона при успехе и половину при провале.</p>'},
 observant:{n:'Внимательный',ab:['int','wis'],s:'+1 Интеллект или Мудрость, +5 к пассивным',d:'<p><b>+1 к Интеллекту или Мудрости.</b></p><p>Читаешь по губам, если видишь рот и знаешь язык.</p><p><b>+5 к пассивному Восприятию и пассивному Анализу.</b></p>',fx:'+5 к пассивным лист прибавит сам'},
 polearm_master:{n:'Мастер древкового оружия',s:'бьёшь древком, держишь дистанцию',d:'<p>Атакуя глефой, алебардой или боевым посохом, можешь бонусным действием ударить другим концом (1к4 дробящего).</p><p>Существо, которое входит в зону твоей досягаемости, провоцирует Удар вслед.</p>'},
 resilient:{n:'Устойчивый',ab:['str','dex','con','int','wis','cha'],save:1,s:'+1 к характеристике и её спасброскам',d:'<p>Выбери характеристику: <b>+1</b> к ней и <b>владение её спасбросками</b>.</p><p class="mu">Телосложение и Харизма у Филиппа уже с владением. Чародею часто советуют Мудрость: от очарования, страха и подчинения спасает она.</p>',fx:'владение спасброском отметится само'},
 ritual_caster:{n:'Ритуальный заклинатель',pre:()=>S.ab.int>=13||S.ab.wis>=13?'':'нужно Интеллект или Мудрость 13 и выше',s:'книга ритуалов без ячеек',d:'<p>Получаешь книгу ритуалов с двумя ритуалами 1 круга выбранного класса и творишь их ритуалом (на 10 минут дольше, без ячейки). Найденные ритуалы можно переписывать в книгу.</p>'},
 savage_attacker:{n:'Дикий атакующий',s:'перебросить урон рукопашного оружия',d:'<p>Раз в ход, когда бросаешь урон рукопашного оружия, можешь перебросить кубики и взять любой из двух результатов.</p>'},
 sentinel:{n:'Страж',s:'останавливаешь врагов Ударом вслед',d:'<p>Если попал Ударом вслед, скорость цели 0 до конца хода.</p><p>Отход не спасает от твоего Удара вслед.</p><p>Если враг в 1,5 м от тебя бьёт другого, можешь реакцией ударить его.</p>'},
 sharpshooter:{n:'Меткий стрелок',s:'стрельба без помех, −5 к атаке, +10 к урону',d:'<p>Дальняя дистанция не даёт помехи. Половинное и три четверти укрытия не мешают.</p><p>Перед выстрелом из оружия, которым владеешь, можешь взять −5 к атаке ради +10 к урону.</p>'},
 shield_master:{n:'Мастер щитов',s:'толкаешь щитом, прячешься за ним',d:'<p>После атаки можешь бонусным действием толкнуть щитом.</p><p>Против заклинаний на одну цель прибавляешь КД щита к спасброску Ловкости.</p><p>Если от эффекта на половину урона прошёл спасбросок Ловкости, можешь реакцией не получить урона совсем.</p>'},
 skilled:{n:'Одарённый',opt:'sk',s:'три новых навыка',d:'<p>Получаешь владение <b>тремя навыками</b> на выбор.</p><p class="mu">По книге можно брать и инструменты вместо навыков: это согласуй с мастером.</p>',fx:'навыки отметятся в листе'},
 skulker:{n:'Проныра',pre:AB13('dex','Ловкость'),s:'прячешься в полумраке',d:'<p>Пытаешься спрятаться, даже когда ты лишь слегка скрыт.</p><p>Промах из укрытия не выдаёт тебя.</p><p>Тусклый свет не даёт помехи на Восприятие.</p>'},

/* ---- что меняется при переходе на уровень t ---- */
function lvDelta(t){const p0=Math.ceil((t-1)/4)+1,p1=Math.ceil(t/4)+1,a=SLT[t-1]||[],b=SLT[t];
 return{prof:[p0,p1],slots:b.map((n,i)=>({c:i+1,was:a[i]||0,now:n})).filter(x=>x.now!==x.was),spt:t>=2?[t===2?0:t-1,t]:null,
  cant:cantKnown(t)-cantKnown(t-1),sp:spKnown(t)-spKnown(t-1),asi:ASI_L.includes(t),meta:META_N[t]||0,
  cantDie:[1+(t-1>=5)+(t-1>=11)+(t-1>=17),1+(t>=5)+(t>=11)+(t>=17)],feat:CLF.filter(f=>f.lv===t&&f.k!=='cf_asi'),newC:b.length>a.length?b.length:0}}

 if(d.asi){st.push('asi');if(LV.asi==='ab')st.push('ab');if(LV.asi==='feat'){st.push('feat');const f=FEATS[LV.feat];if(f&&(f.opt||(f.ab&&f.ab.length>1)))st.push('fopt')}}
 if(d.meta)st.push('meta');if(d.cant>0)st.push('cant');if(d.sp>0)st.push('spell');

function lvHp(){const a=lvAb(),c0=mod(S.ab.con),c1=mod(a.con),t=LV.to,tough=LV.asi==='feat'&&LV.feat==='tough';
 const roll=LV.hpV||0,lvg=Math.max(1,roll+c1),retro=(c1-c0)*(t-1),tg=tough?2*t:hasFeat('tough')?2:0;
 return{roll,c1,lvg,retro,tg,add:lvg+retro+tg,max:S.hp.max+lvg+retro+tg}}
function lvOk(st){switch(st){
 case 'hp':return LV.hpV!=null;
 case 'asi':return !!LV.asi;

 case 'feat':return !!LV.feat;
 case 'fopt':{const f=FEATS[LV.feat];if(f.opt==='el')return !!LV.fx;if(f.opt==='sk')return LV.fsk.length===3;return !!LV.fab}
 case 'meta':return LV.meta.length===lvDelta(LV.to).meta;
 case 'cant':return LV.cant.length===lvDelta(LV.to).cant;
 case 'spell':return LV.sp.length===lvDelta(LV.to).sp;
 case 'swapin':return !!LV.swapIn;
 default:return true}}

 if(st==='ab'||(st==='fopt'&&FEATS[LV.feat].ab&&!FEATS[LV.feat].opt)){const fe=st==='fopt',allow=fe?FEATS[LV.feat].ab:AB.map(x=>x[0]),used=fe?(LV.fab?1:0):Object.values(LV.ab).reduce((s,x)=>s+x,0),max=fe?1:2;

/* =====================================================================

   «Бой» и «Общение» сами показывают самые часто используемые заклинания: счётчик localStorage 'filipp-use-v1' = {группа:{ключ:сколько раз}}.
   Пока счёт равный, порядок запасной: прежний ручной выбор (S.fSpellShow / S.smagShow), потом заговоры, потом по кругу.
   «все заклинания ›» = INFO.myspells: все известные, нажатие сразу открывает заклинание (sp_), в нём кнопка назад к списку.
   Книга заклинаний: круги свёрнуты (BKOPEN), после заговоров от старшего к младшему.
   Здесь только объявления функций и var: их можно звать из любого места файла (без ловушки TDZ).
   ===================================================================== */
function useKey(){return TEST?'filipp-use-test10':'filipp-use-v1'}
function useGet(){try{const o=JSON.parse(localStorage.getItem(useKey()));return o&&typeof o==='object'?o:{}}catch(e){return{}}}
function useBump(g,k){try{const o=useGet();(o[g]=o[g]||{})[k]=(o[g][k]||0)+1;localStorage.setItem(useKey(),JSON.stringify(o))}catch(e){}}
function useTop(g,keys){const c=useGet()[g]||{};return keys.filter(k=>(c[k]||0)>=2).sort((a,b)=>c[b]-c[a]||keys.indexOf(a)-keys.indexOf(b)).slice(0,2)}
function useOrder(g,keys){const t=useTop(g,keys);return t.concat(keys.filter(k=>!t.includes(k)))}
function spAuto(kind,max){const c=useGet().cast||{},pref=(kind==='fight'?S.fSpellShow:S.smagShow)||[],keys=known().filter(k=>SPELLS[k]&&SPELLS[k][kind]);

 const grp=lv=>Object.keys(SPELLS).filter(k=>SPELLS[k].lv===lv).sort((a,b)=>SPELLS[a].n.localeCompare(SPELLS[b].n,'ru'));
 const fold=(id,title,cnt,list)=>{const o=BKOPEN[id];return `<button class="fold ${o?'open':''}" data-fold="${id}"><span class="fa">▸</span><span class="ft">${title}</span><em>${cnt}</em></button><div class="fbody" ${o?'':'hidden'}>${list.map(row).join('')}</div>`};
 const cntOf=g=>{const x=g.filter(k=>kn.includes(k)).length;return x?`выбрано ${x} из ${g.length}`:`${g.length} шт.`};
 let body=`<div class="bkh"><span>Заговоры</span><em class="${n.c>=n.C?'full':''}" data-cnt="c">${n.c} из ${n.C}</em></div>`+fold('c0','Все заговоры',cntOf(grp(0)),grp(0));
 body+=`<div class="bkh"><span>Заклинания</span><em class="${n.s>=n.Sx?'full':''}" data-cnt="s">${n.s} из ${n.Sx}${mc>1?' (всех кругов)':''}</em></div>`;
 for(let c=mc;c>=1;c--){const g=grp(c);if(g.length)body+=fold('c'+c,ROM[c]+' круг',cntOf(g),g)}
 body+=`<div class="how" style="margin-top:10px">Нажми на круг, чтобы раскрыть его. Галочка: Филипп знает это заклинание. Нажми на название, чтобы прочитать, что оно делает.<br><span class="gpc">${coinSvg(['#f3cf7a','#a8761e'])}50 зм</span> заклинанию нужен дорогой компонент: его надо купить один раз и держать в инвентаре.<br>Когда всё набрано, сними галочку с одного, чтобы взять другое. По правилам чародей меняет одно известное заклинание при новом уровне, перебор больше этого согласуй с мастером.${mc>1?'<br>Заклинаний 2 круга и выше в листе пока не все.':''}</div>`;
 return{t:'Книга заклинаний',sub:`чародей ${S.level} уровня · заговоров ${n.C}, заклинаний ${n.Sx}, круги до ${ROM[mc]}`,body,acts:`<button data-act="closeD">Готово</button><button class="ghost" data-info="myspells">Все известные заклинания ›</button>`}};

/* =====================================================================
   СБРОС ДО БАЗОВОГО 2 УРОВНЯ (перенесено из листа Арадии, PR #107): кнопка внизу «Правки листа» (карандаш), с подтверждением.
   Возвращает уровень, характеристики, хиты, навыки, черты, метамагию, заклинания, ячейки и единицы чародейства как при создании Филиппа.
   Снимает концентрацию, Щит, Доспехи мага, истощение, спасброски от смерти, историю повышений.
   НЕ трогает: инвентарь, экипировку, деньги, состояния, класс доспеха, выбор предметов, счётчик частых заклинаний.
   Перед сбросом весь лист кладётся в localStorage SKEY+'-bak': кнопка «Вернуть лист как был до сброса».
   ===================================================================== */
function rBak(){return SKEY+'-bak'}
function hasBak(){try{return !!localStorage.getItem(rBak())}catch(e){return false}}
function resetBase(){try{localStorage.setItem(rBak(),JSON.stringify(S))}catch(e){}
 const D=structuredClone(DEFAULT);
 ['level','ab','saves','skills','hp','speed','luck','chaos'].forEach(k=>S[k]=D[k]);
 S.hd={die:D.hd.die,used:0};S.known=[...KNOWN];S.slots={max:3,used:0,extra:0};S.hi={};S.spt={max:2,used:0};delete S.meta;
 S.feats=[{k:'lucky'}];S.lvHist=[];S.conc=null;S.shieldOn=0;S.mArm=0;S.exh=0;S.death={s:0,f:0};metaArm=null;
 save();$('sheet').classList.remove('on');closeDrawer();renderAll();fit();$('lvBtn').classList.remove('max');vib([30,20,10]);
 if(!RM)$('cl').animate([{transform:'translateY(-4px)',opacity:.3},{transform:'none',opacity:1}],{duration:400,easing:'ease-out'})}
function resetUndo(){let b=null;try{b=localStorage.getItem(rBak())}catch(e){}if(!b)return;
 try{localStorage.setItem(SKEY,b);localStorage.removeItem(rBak())}catch(e){}location.reload()}
{const _es=editSheet;editSheet=function(){_es();const f=$('form');
 f.insertAdjacentHTML('beforeend',`<div class="rst"><button class="go" type="button" id="rstBtn">Сбросить до базового 2 уровня</button>
  <div class="rstq" hidden><p>Уровень, характеристики, хиты, навыки, черты, метамагия, заклинания и ячейки станут как при создании Филиппа (2 уровень). Инвентарь, экипировка и деньги останутся.</p>
  <button class="go rsty" type="button" id="rstYes">Да, сбросить до 2 уровня</button><button class="go" type="button" id="rstNo">Не сбрасывать</button></div>
  ${hasBak()?'<button class="go" type="button" id="rstBack">Вернуть лист как был до сброса</button>':''}</div>`);
 $('rstBtn').onclick=()=>{$('rstBtn').hidden=true;f.querySelector('.rstq').hidden=false;vib(10)};
 $('rstNo').onclick=()=>{$('rstBtn').hidden=false;f.querySelector('.rstq').hidden=true};
 $('rstYes').onclick=resetBase;
 if($('rstBack'))$('rstBack').onclick=resetUndo}}

renderAll();fit();setTimeout(fit,300);wideFix();
/* самообновление: сайт разрешает телефону держать старую копию до 10 минут.
   При открытии и при возврате в приложение тихо проверяем, нет ли версии новее, и сразу её грузим. */
const BUILD='2026-11-28-61';
function checkUpdate(){if(location.protocol==='file:')return;
 fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
  const m=t.match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
  let tried='';try{tried=sessionStorage.getItem('filipp-upd')||''}catch(e){}
  if(tried===m[1])return;try{sessionStorage.setItem('filipp-upd',m[1])}catch(e){}
  {const q=new URLSearchParams(location.search);q.set('v',m[1]);location.replace(location.pathname+'?'+q)}}).catch(()=>{})}
checkUpdate();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
